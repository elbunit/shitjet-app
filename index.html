  }
};

window.kerkoProduktin = function(val) {
  const box = document.getElementById('prod-suggestions');
  if (!box) return;
  const v = (val||'').trim().toLowerCase();
  // Build map: produkti -> {count, total, cmimi i fundit, njesia e fundit}
  const prodMap = {};
  shitjet.forEach(function(s) {
    if (!s.produkti) return;
    const k = (s.produkti||"").toLowerCase().trim();
    if (!prodMap[k]) prodMap[k] = {count:0, total:0, cmimi:0, njesia:'cop', data:'', emri:s.produkti||""};
    prodMap[k].count++;
    prodMap[k].total += (s.total||0);
    if (!prodMap[k].data || (s.data||'') > prodMap[k].data) {
      prodMap[k].data = s.data||'';
      prodMap[k].cmimi = s.cmimi||0;
      prodMap[k].njesia = s.njesia||'cop';
    }
  });
  // Filter and sort by count
  const results = Object.entries(prodMap)
    .filter(function(e) { return !v || e[0].toLowerCase().includes(v); })
    .sort(function(a,b) { return b[1].count - a[1].count; })
    .slice(0, 6);
  if (!results.length || !val) { box.innerHTML = ''; return; }
  let html = '<div style="position:absolute;left:0;right:0;background:var(--bg2);border:1px solid var(--accent);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.3);overflow:hidden;margin-top:2px">';
  results.forEach(function(e) {
    const name = e[0], d = e[1];
    html += '<div onclick="zgjidhProduktin(' + JSON.stringify(name) + ',' + d.cmimi + ',' + JSON.stringify(d.njesia) + ')" '
      + 'style="padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center" '
      + 'onmouseover="this.style.background=\'var(--bg3)\'" onmouseout="this.style.background=\'\'">'
      + '<div><div style="font-weight:600;font-size:14px">' + name + '</div>'
      + '<div style="font-size:11px;color:var(--text2)">' + d.count + ' here shitur</div></div>'
      + '<div style="text-align:right"><div style="font-size:13px;font-weight:600;color:var(--accent)">' + fm(d.cmimi) + '</div>'
      + '<div style="font-size:11px;color:var(--text2)">' + d.njesia + '</div></div>'
      + '</div>';
  });
  html += '</div>';
  box.innerHTML = html;
};

window.zgjidhProduktin = function(emri, cmimi, njesia) {
  const inp = document.getElementById('s-prod');
  if (inp) inp.value = emri;
  const cmiEl = document.getElementById('s-cmi');
  if (cmiEl && cmimi > 0) cmiEl.value = cmimi;
  const njesEl = document.getElementById('s-njes');
  if (njesEl && njesia) njesEl.value = njesia;
  const box = document.getElementById('prod-suggestions');
  if (box) box.innerHTML = '';
  llogarit();
};

window.llogaritKusuri = function() {
  const s = parseFloat(document.getElementById('s-sasi')?.value)||0;
  const c = parseFloat(document.getElementById('s-cmi')?.value)||0;
  const total = s * c;
  const marra = parseFloat(document.getElementById('s-marra')?.value)||0;
  const box = document.getElementById('kusuri-box');
  const shumaEl = document.getElementById('kusuri-shuma');
  if (!box || !shumaEl) return;
  if (marra > 0 && total > 0) {
    const kusuri = marra - total;
    box.style.display = 'block';
    if (kusuri < 0) {
      shumaEl.style.color = 'var(--error)';
      shumaEl.textContent = 'Para nuk mjaftojne! Mungon ' + fm(Math.abs(kusuri));
    } else {
      shumaEl.style.color = 'var(--accent)';
      shumaEl.textContent = fm(kusuri);
    }
  } else {
    box.style.display = 'none';
  }
};

// Resize foto dhe ktheje si Base64
function resizeDheBase64(file, maxPx) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.onerror = function() { reject(new Error('Leximi i fotos deshtoi')); };
    reader.onload = function(e) {
      const img = new Image();
      img.onerror = function() { reject(new Error('Foto e pavlefshme')); };
      img.onload = function() {
        let w = img.width, h = img.height;
        if (w > maxPx || h > maxPx) {
          if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
          else { w = Math.round(w * maxPx / h); h = maxPx; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        // Quality 0.75 - balance mes madhesise dhe cilesise
        const b64 = canvas.toDataURL('image/jpeg', 0.75);
        resolve(b64);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

window.ruajShitjen = async function() {
  const prod = document.getElementById('s-prod').value.trim();
  const sasi = parseFloat(document.getElementById('s-sasi').value);
  const cmi = parseFloat(document.getElementById('s-cmi').value);
  const njes = document.getElementById('s-njes').value.trim() || 'cop';
  const data = document.getElementById('s-data').value;
  const kli = document.getElementById('s-kli').value.trim();
  const shen = document.getElementById('s-shen').value.trim();
  if (!prod) return err('Shkruaj emrin e produktit!');
  if (!sasi||sasi<=0) return err('Sasia duhet > 0!');
  if (!cmi||cmi<=0) return err('Cmimi duhet > 0!');
  const btn = document.getElementById('btn-ruaj');
  btn.textContent = 'Duke ruajtur...'; btn.disabled = true;
  try {
    let fotoUrl = '';
    const finp = document.getElementById('s-foto');
    if (finp.files && finp.files[0]) {
      try {
        const file = finp.files[0];
        fotoUrl = await resizeDheBase64(file, 400);
      } catch(fe) {
        console.warn('foto gabim:', fe.message);
        err('Foto nuk u ngarkua - shitja po ruhet pa foto!');
      }
    }
    const punetor = isAdmin ? 'Admin' : (currentUser.email||'').split('@')[0];
    const total = sasi * cmi;

    // Kontrollo zbritje nga stoku
    const eshteZbritje = stockIZgjedhur && cmi < stockIZgjedhur.cmimiShitjes;
    const stockId = stockIZgjedhur ? stockIZgjedhur.id : null;
    const cmimiStandard = stockIZgjedhur ? stockIZgjedhur.cmimiShitjes : null;

    const shitjaData = {
      produkti: prod, sasia: sasi, cmimi: cmi, njesia: njes,
      data: data, klienti: kli, shen: shen, total: total,
      fotoUrl: fotoUrl, punetori: punetor, punetoriUid: currentUser.uid,
    };
    if (stockId) shitjaData.stockId = stockId;
    if (eshteZbritje) { shitjaData.eshteZbritje = true; shitjaData.cmimiStandard = cmimiStandard; }

    if (!navigator.onLine) {
      await shtoPorositOffline(Object.assign({ type: 'shitje' }, shitjaData));
      ok('Shitja u ruajt offline! Do sinkronizohet kur te kthehet interneti.');
      dergoPushLokal('Shitje e ruajtur offline', prod + ' - ' + fm(total));
      stockIZgjedhur = null;
      navTo('shitjet');
      return;
    }

    const _docRef = await addDoc(collection(db, 'shitjet'), Object.assign({}, shitjaData, {
      krijuar: serverTimestamp(), ndryshuar: serverTimestamp()
    }));
    const _shitjeId = _docRef.id;
    ok('Shitja u ruajt!');
    totaliMuajit = null;  // rifresko totalin e muajit
    dergoPushLokal('Shitje e re', prod + ' - ' + fm(total));
    const shenLine = shen ? '\nShenimi: ' + shen : '';
    const zbritjeLine = eshteZbritje ? '\nZBRITJE: ' + fm(cmimiStandard) + ' => ' + fm(cmi) + ' (-' + fm(cmimiStandard - cmi) + '/cope)' : '';
    const _fotoLine = fotoUrl ? '\n📸 Foto: https://muddy-dream-3105.elbunit-r.workers.dev/foto?id=' + _shitjeId : '';
    await tg('<b>Shitje e Re - DOHA Accessories</b>\n\nProdukti: ' + prod + '\nSasia: ' + sasi + ' ' + njes + '\nCmimi: EUR' + cmi + '\nTotal: ' + fm(total) + '\nPunetori: ' + punetor + '\nData: ' + data + zbritjeLine + shenLine + _fotoLine);

    await kontrolloRekordin(punetor, data, total);
    stockIZgjedhur = null;
    navTo('shitjet');
  } catch(e) {
    err('Gabim: ' + e.message);
  } finally {
    btn.textContent = 'Ruaj Shitjen'; btn.disabled = false;
  }
};

// ── SHITJET ───────────────────────────────────────
function renderShitjet() {
  const sotStr = new Date().toISOString().split('T')[0];
  const lista = isAdminView() ? shitjet : shitjet.filter(function(s) { return s.data === sotStr && s.punetoriUid !== 'admin_posta'; });

  // Rendit sipas krijuar (timestamp) - me i riu pari
  const listaSorted = lista.slice().sort(function(a, b) {
    const aT = a.krijuar && a.krijuar.seconds ? a.krijuar.seconds : 0;
    const bT = b.krijuar && b.krijuar.seconds ? b.krijuar.seconds : 0;
    if (aT !== bT) return bT - aT;
    return (b.data||'').localeCompare(a.data||'');
  });

  const grouped = {};
  listaSorted.forEach(function(s) {
    if (!grouped[s.data]) grouped[s.data] = [];
    grouped[s.data].push(s);
  });
  const rows = Object.entries(grouped).sort(function(a,b) { return b[0].localeCompare(a[0]); }).slice(0,30);

  let html = '<div class="page-header"><h1 class="page-title">' + (isAdminView() ? 'Te gjitha Shitjet' : 'Shitjet Sot') + '</h1>'
    + '<button class="btn-primary small" onclick="navTo(\'shito\')">+ Shitje e Re</button></div>';
  if (!isAdminView()) html += '<div class="info-box">Po shfaqen vetem shitjet e sotme</div>';
  if (!rows.length) html += '<div class="empty-state">Nuk ka shitje.</div>';

  rows.forEach(function(entry) {
    const data = entry[0], items = entry[1];
    const dayTot = items.reduce(function(a,s) { return a+(s.total||0); }, 0);
    const sotKlasa = eshteSot(data) ? ' today' : '';
    html += '<div class="day-group"><div class="day-header' + sotKlasa + '"><span>' + dataNjerezore(data) + '</span><span class="day-total">' + fm(dayTot) + '</span></div>';
    items.forEach(function(s) {
      if (s.id && s.fotoUrl) fotoMap[s.id] = s.fotoUrl;
      const foto = s.fotoUrl ? '<button data-sid="' + (s.id||'') + '" onclick="shfaqFotoById(this.dataset.sid)" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:20px;padding:0;line-height:1" title="Shiko foton">&#128247;</button>' : '';
      const ora = s.krijuar && s.krijuar.seconds
        ? '<span style="font-size:11px;color:var(--text2)">' + new Date(s.krijuar.seconds*1000).toLocaleTimeString('sq',{hour:'2-digit',minute:'2-digit'}) + '</span> '
        : '';
      const delBtn = isAdminView() ? '<button class="del-btn" onclick="fshijShitje(\'' + s.id + '\')">&#10005;</button>' : '';
      const editBtn = '<button class="edit-btn" data-id="' + s.id + '" onclick="hapEditShitje(this.dataset.id)">&#9998;</button>';
      html += '<div class="shitje-row">' + foto
        + '<div class="shitje-info">' + ora + '<strong>' + s.produkti + '</strong>'
        + '<span>' + s.sasia + ' ' + (s.njesia||'cop') + ' x ' + fm(s.cmimi)
        + (s.klienti ? ' &bull; ' + s.klienti : '')
        + ' &bull; <span class="punetor-tag">' + (s.punetori||'-') + '</span>'
        + (s.shen ? ' &bull; ' + s.shen : '') + '</span></div>'
        + '<div style="display:flex;align-items:center;gap:8px"><div class="shitje-total">' + fm(s.total) + '</div>' + editBtn + delBtn + '</div></div>';
    });
    html += '</div>';
  });

  document.getElementById('content').innerHTML = html;
}

// ── KLIENTET ──────────────────────────────────────
function renderKlientet() {
  const byK = {};
  shitjet.forEach(function(s) {
    if (!s.klienti) return;
    if (!byK[s.klienti]) byK[s.klienti] = {total:0, count:0};
    byK[s.klienti].total += s.total||0;
    byK[s.klienti].count++;
  });
  const list = Object.entries(byK).sort(function(a,b) { return b[1].total - a[1].total; });
  let html = '<div class="page-header"><h1 class="page-title">Klientet</h1></div>'
    + '<div class="pun-list">';
  if (!list.length) html += '<div class="empty-state">Nuk ka klient te regjistruar.</div>';
  list.forEach(function(entry) {
    const emri = entry[0], d = entry[1];
    html += '<div class="klient-row" onclick="shfaqKlientin(\'' + emri.replace(/'/g,"&#39;") + '\')">'
      + '<div class="pun-avatar">' + emri[0].toUpperCase() + '</div>'
      + '<div class="pun-info"><strong>' + emri + '</strong><span>' + d.count + ' blerje</span></div>'
      + '<div class="pun-stats">' + fm(d.total) + '</div>'
      + '<span style="color:var(--text2)">&#8250;</span></div>';
  });
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

window.shfaqKlientin = function(emri) {
  const list = shitjet.filter(function(s) { return s.klienti === emri; }).sort(function(a,b) { return (b.data||'').localeCompare(a.data||''); });
  const tot = list.reduce(function(a,s) { return a+(s.total||0); }, 0);
  let html = '<div class="page-header"><div><h1 class="page-title">' + emri + '</h1>'
    + '<p class="page-sub">' + list.length + ' blerje &bull; ' + fm(tot) + '</p></div>'
    + '<button class="btn-secondary small" onclick="navTo(\'klientet\')">&#8592; Klientet</button></div>'
    + '<div class="day-group">';
  if (!list.length) html += '<div class="empty-state">Nuk ka blerje.</div>';
  list.forEach(function(s) {
    if (s.id && s.fotoUrl) fotoMap[s.id] = s.fotoUrl;
    const foto = s.fotoUrl ? '<button data-sid="' + (s.id||'') + '" onclick="shfaqFotoById(this.dataset.sid)" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:20px;padding:0;line-height:1" title="Shiko foton">&#128247;</button>' : '';
    html += '<div class="shitje-row">' + foto
      + '<div class="shitje-info"><strong>' + s.produkti + '</strong>'
      + '<span>' + s.data + ' &bull; ' + s.sasia + ' ' + (s.njesia||'cop') + (s.shen?' &bull; '+s.shen:'') + '</span></div>'
      + '<div class="shitje-total">' + fm(s.total) + '</div></div>';
  });
  html += '</div>';
  document.getElementById('content').innerHTML = html;
};

window.shtoPunetor = async function() {
  const emri = document.getElementById('p-emri').value.trim();
  const username = document.getElementById('p-user').value.trim().toLowerCase();

async function ngarkoFinancat() {
  if (financaCache) return financaCache;
  try {
    const res = await Promise.all([
      getDocs(collection(db,'shpenzime')),
      getDocs(collection(db,'shpenzime_fikse')).catch(function(){ return {docs:[]}; }),
      getDocs(collection(db,'paga')).catch(function(){ return {docs:[]}; })
    ]);
    financaCache = {
      shpenzime: res[0].docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }),
      fikse:     res[1].docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }),
      paga:      res[2].docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
    };
  } catch(e) {
    console.warn('financat:', e.message);
    financaCache = { shpenzime: [], fikse: [], paga: [] };
  }
  return financaCache;
}

function llogaritCOGS(lista) {
  const map = {};
  stock.forEach(function(p) { map[(p.emri||'').toLowerCase().trim()] = p; });
  let kosto = 0, mbuluar = 0, pambuluar = 0;
  lista.forEach(function(s) {
    const p = map[(s.produkti||'').toLowerCase().trim()];
    if (p && p.cmimiBlerjes) {
      kosto += (p.cmimiBlerjes||0) * (s.sasia||1);
      mbuluar += (s.total||0);
    } else {
      pambuluar += (s.total||0);
    }
  });
  return { kosto: kosto, mbuluar: mbuluar, pambuluar: pambuluar };
}

function shpenzimetPerPeriudhe(prefix) {
  const f = financaCache || { shpenzime: [], fikse: [], paga: [] };
  const dit = f.shpenzime.filter(function(s) { return (s.data||'').startsWith(prefix); })
    .reduce(function(a,s) { return a + (s.shuma||0); }, 0);
  const fik = f.fikse.filter(function(s) { return (s.muaji||'').startsWith(prefix); })
    .reduce(function(a,s) { return a + (s.shuma||0); }, 0);
  const pag = f.paga.filter(function(s) { return (s.muaji||'').startsWith(prefix); })
    .reduce(function(a,s) { return a + (s.shuma||0); }, 0);
  return { ditore: dit, fikse: fik, paga: pag, total: dit + fik + pag };
}

// ═══ GRAFIKONE ═══
const PALETE = ['#f0b429','#22c55e','#3b82f6','#a855f7','#ec4899','#14b8a6','#f97316','#8b8b9a'];

// Grafik linje me boshte
function grafikLinje(pika, opt) {
  opt = opt || {};
  if (!pika.length) return '<div class="empty-sub" style="text-align:center;padding:24px">Pa te dhena</div>';
  const ma = opt.ma || null;   // array i mesatares rreshqitese
  const W = 320, H = 150, PL = 34, PB = 20, PT = 8, PR = 6;
  const iw = W - PL - PR, ih = H - PT - PB;
  const vals = pika.map(function(p){ return p.v; });
  const maxV = Math.max.apply(null, vals.concat([1]));
  const n = pika.length;
  const x = function(i) { return PL + (n === 1 ? iw/2 : (i/(n-1))*iw); };
  const y = function(v) { return PT + ih - (v/maxV)*ih; };

  let g = '';
  for (let k = 0; k <= 3; k++) {
    const yy = PT + (ih/3)*k;
    const vv = maxV - (maxV/3)*k;
    g += '<line class="grid" x1="' + PL + '" y1="' + yy.toFixed(1) + '" x2="' + (W-PR) + '" y2="' + yy.toFixed(1) + '"/>'
      + '<text class="ax" x="' + (PL-5) + '" y="' + (yy+3).toFixed(1) + '" text-anchor="end">' + (vv >= 1000 ? (vv/1000).toFixed(1)+'k' : Math.round(vv)) + '</text>';
  }
  const d = pika.map(function(p,i) { return (i?'L':'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' ');
  const area = d + ' L' + x(n-1).toFixed(1) + ' ' + (PT+ih) + ' L' + x(0).toFixed(1) + ' ' + (PT+ih) + ' Z';

  let lbls = '';
  const hap = Math.max(1, Math.ceil(n/7));
  pika.forEach(function(p,i) {
    if (i % hap === 0 || i === n-1) {
      lbls += '<text class="ax" x="' + x(i).toFixed(1) + '" y="' + (H-6) + '" text-anchor="middle">' + p.l + '</text>';
    }
  });
  let dots = '';
  if (n <= 32) {
    pika.forEach(function(p,i) {
      if (p.v > 0) dots += '<circle class="dot" cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="2.6"/>';
    });
  }
  let maPath = '';
  if (ma && ma.length === n) {
    const dm = ma.map(function(v,i) { return (i?'L':'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' ');
    maPath = '<path d="' + dm + '" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>';
  }
  return '<svg class="line-svg" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">'
    + g + '<path class="ar" d="' + area + '"/><path class="ln" d="' + d + '"'
    + (ma ? ' opacity=".38"' : '') + '/>' + maPath + (ma ? '' : dots) + lbls + '</svg>';
}

// Donut
function grafikDonut(pjeset) {
  const tot = pjeset.reduce(function(a,p){ return a+p.v; }, 0);
  if (!tot) return '<div class="empty-sub" style="text-align:center;padding:24px">Pa te dhena</div>';
  const R = 60, C = 2*Math.PI*R;
  let off = 0, segs = '';
  pjeset.forEach(function(p,i) {
    const frac = p.v/tot;
    const len = frac*C;
    segs += '<circle r="' + R + '" cx="75" cy="75" stroke="' + PALETE[i%PALETE.length] + '"'
      + ' stroke-dasharray="' + len.toFixed(2) + ' ' + (C-len).toFixed(2) + '"'
      + ' stroke-dashoffset="' + (-off).toFixed(2) + '" stroke-linecap="butt"/>';
    off += len;
  });
  let rows = '';
  pjeset.forEach(function(p,i) {
    rows += '<div class="donut-row"><span><i style="background:' + PALETE[i%PALETE.length] + '"></i>' + p.l + '</span>'
      + '<span><strong>' + fm(p.v) + '</strong> <span style="color:var(--text2);font-size:11px">' + (p.v/tot*100).toFixed(0) + '%</span></span></div>';
  });
  return '<div class="donut-wrap"><svg class="donut" viewBox="0 0 150 150">' + segs + '</svg>'
    + '<div class="donut-mid">' + rows + '</div></div>';
}

// Bar horizontal
function grafikHBar(rreshtat, ngjyre) {
  if (!rreshtat.length) return '<div class="empty-sub" style="text-align:center;padding:24px">Pa te dhena</div>';
  const maxV = Math.max.apply(null, rreshtat.map(function(r){ return r.v; }).concat([1]));
  return rreshtat.map(function(r,i) {
    const col = ngjyre || PALETE[i%PALETE.length];
    return '<div class="hbar"><div class="hbar-top"><span>' + r.l + '</span>'
      + '<span><strong>' + fm(r.v) + '</strong>' + (r.nen ? ' <span style="color:var(--text2);font-size:11px">' + r.nen + '</span>' : '') + '</span></div>'
      + '<div class="hbar-track"><div class="hbar-fill" style="width:' + (r.v/maxV*100).toFixed(1) + '%;background:' + col + '"></div></div></div>';
  }).join('');
}

// Kolona javore
function grafikJave(ditet) {
  const maxV = Math.max.apply(null, ditet.map(function(d){ return d.v; }).concat([1]));
  const mesat = ditet.filter(function(d){return d.v>0;});
  const av = mesat.length ? mesat.reduce(function(a,d){return a+d.v;},0)/mesat.length : 0;
  return '<div class="wk-grid">' + ditet.map(function(d) {
    const zero = d.v <= 0;
    const col = zero ? 'var(--border)' : (d.v >= av ? '#22c55e' : 'var(--accent)');
    return '<div class="wk-col"><div class="wk-val"' + (zero?' style="opacity:.35"':'') + '>' + (d.v>=1000?(d.v/1000).toFixed(1)+'k':Math.round(d.v)) + '</div>'
      + '<div class="wk-wrap"><div class="wk-bar" style="height:' + (zero?2:(d.v/maxV*100)) + '%;background:' + col + (zero?';opacity:.5':'') + '"></div></div>'
      + '<div class="wk-lbl">' + d.l + '</div></div>';
  }).join('') + '</div>';
}

// Llogarit te gjitha metrikat per nje muaj
function kpiMetrika(muajStr) {
  const sh = shitjet.filter(function(s) { return (s.data||'').startsWith(muajStr); });
  const tv = sh.reduce(function(a,s) { return a+(s.total||0); }, 0);
  const dite = {};
  sh.forEach(function(s) { if (s.data) dite[s.data] = true; });
  const nrDite = Object.keys(dite).length;
  const cg = llogaritCOGS(sh);
  const shp = shpenzimetPerPeriudhe(muajStr);
  const bruto = tv - cg.kosto;
  const neto = bruto - shp.total;
  const kl = {};
  sh.forEach(function(s) { const k=(s.klienti||'').trim().toLowerCase(); if(k) kl[k]=(kl[k]||0)+1; });
  const njesi = sh.reduce(function(a,s){ return a+(s.sasia||1); }, 0);
  const y = parseInt(muajStr.substring(0,4)), mi = parseInt(muajStr.substring(5,7)) - 1;
  return {
    muaj: muajStr,
    etiketa: ['Janar','Shkurt','Mars','Prill','Maj','Qershor','Korrik','Gusht','Shtator','Tetor','Nentor','Dhjetor'][mi] + ' ' + String(y).slice(2),
    tv: tv, fatura: sh.length, njesi: njesi,
    aov: sh.length ? tv/sh.length : 0,
    nrDite: nrDite,
    perDite: nrDite ? tv/nrDite : 0,
    cogs: cg.kosto, bruto: bruto, neto: neto,
    marzhBruto: tv > 0 ? bruto/tv*100 : 0,
    marzhNeto: tv > 0 ? neto/tv*100 : 0,
    shpTotal: shp.total,
    klient: Object.keys(kl).length
  };
}

function tabelaKrahasimi(lista) {

    { grup: 'Te ardhura' },
    { k:'tv',         l:'Xhiro totale',        f: fm,                          max:1 },
    { k:'fatura',     l:'Numri i faturave',    f: function(v){ return String(v); }, max:1 },
    { k:'njesi',      l:'Njesi te shitura',    f: function(v){ return String(v); }, max:1 },
    { k:'aov',        l:'Mesatarja / fature',  f: fm,                          max:1 },
    { grup: 'Aktiviteti' },
    { k:'nrDite',     l:'Dite me shitje',      f: function(v){ return String(v); }, max:1 },
    { k:'perDite',    l:'Xhiro / dite',        f: fm,                          max:1 },
    { k:'klient',     l:'Klientet unike',      f: function(v){ return String(v); }, max:1 },
    { grup: 'Fitimi' },
    { k:'cogs',       l:'Kosto e mallit',      f: fm,                          max:0 },
    { k:'bruto',      l:'Fitimi bruto',        f: fm,                          max:1 },
    { k:'marzhBruto', l:'Marzhi bruto',        f: function(v){ return v.toFixed(1)+'%'; }, max:1 },
    { k:'shpTotal',   l:'Shpenzime',           f: fm,                          max:0 },
    { k:'neto',       l:'Fitimi neto',         f: fm,                          max:1 },
    { k:'marzhNeto',  l:'Marzhi neto',         f: function(v){ return v.toFixed(1)+'%'; }, max:1 }
  ];

  let h = '<div class="cmp-scroll"><table class="cmp-tbl"><thead><tr><th>Treguesi</th>'
    + lista.map(function(m){ return '<th>' + m.etiketa + '</th>'; }).join('')
    + (lista.length === 2 ? '<th>Ndryshim</th>' : '')
    + '</tr></thead><tbody>';

  rreshtat.forEach(function(r) {
    if (r.grup) {
      h += '<tr class="sep"><td colspan="' + (lista.length + (lista.length===2?2:1)) + '">' + r.grup + '</td></tr>';
      return;
    }
    const vals = lista.map(function(m){ return m[r.k]; });
    const kufi = r.max ? Math.max.apply(null, vals) : Math.min.apply(null, vals);
    h += '<tr><td class="met">' + r.l + '</td>';
    lista.forEach(function(m) {
      const v = m[r.k];
      const best = lista.length > 1 && v === kufi && v !== 0;
      h += '<td class="num' + (best ? ' best' : '') + '">' + r.f(v) + '</td>';
    });
    if (lista.length === 2) {
      const a = vals[1], b = vals[0];   // i fundit vs i pari (kronologjik)
      const d = b !== 0 ? ((a-b)/Math.abs(b)*100) : 0;
      h += '<td class="num">' + (b !== 0 ? pctBadge(d) : '&mdash;') + '</td>';
    }
    h += '</tr>';
  });

  h += '</tbody></table></div>';

  // Grafik krahasimi i xhiros
  const maxTv = Math.max.apply(null, lista.map(function(m){ return m.tv; }).concat([1]));
  h += '<div class="gr-card" style="margin-top:14px"><div class="gr-titull">Xhiro sipas muajit</div>'
    + '<div class="gr-nen">Krahasim vizual</div>'
    + lista.map(function(m,i) {
        return '<div class="hbar"><div class="hbar-top"><span>' + m.etiketa + '</span>'
          + '<span><strong>' + fm(m.tv) + '</strong> <span style="color:var(--text2);font-size:11px">'
          + m.fatura + ' fatura</span></span></div>'

          + '%;background:' + PALETE[i%PALETE.length] + '"></div></div></div>';
      }).join('')
    + '</div>';

  // Permbledhje
  const meMira = lista.slice().sort(function(a,b){ return b.tv-a.tv; })[0];
  const totTv = lista.reduce(function(a,m){ return a+m.tv; }, 0);
  const totNeto = lista.reduce(function(a,m){ return a+m.neto; }, 0);
  h += '<div style="background:var(--bg3);border-radius:12px;padding:16px;margin-top:14px">'
    + '<div class="section-title" style="margin-bottom:10px">PERMBLEDHJE</div>'
    + '<div style="font-size:13px;line-height:1.75;color:var(--text2)">'
    + '&bull; Gjithsej ne ' + lista.length + ' muaj: <strong style="color:var(--text)">' + fm(totTv) + '</strong>'
    + ' xhiro, fitim neto <strong style="color:' + (totNeto>=0?'var(--success)':'var(--error)') + '">' + fm(totNeto) + '</strong>.<br>'
    + '&bull; Muaji me i mire: <strong style="color:var(--accent)">' + meMira.etiketa + '</strong> me ' + fm(meMira.tv) + '.<br>'
    + '&bull; Mesatarja mujore: <strong style="color:var(--text)">' + fm(totTv/lista.length) + '</strong>.'
    + '</div></div>';

  return h;
}

// ── MOTI (Open-Meteo, pa API key) ──
async function ngarkoMotin() {
  if (motiCache) return motiCache;
  try {
    const q = 'latitude=' + PRISHTINA.lat + '&longitude=' + PRISHTINA.lon
      + '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weather_code'
      + '&timezone=Europe%2FBelgrade';
    const res = await fetch('https://api.open-meteo.com/v1/forecast?' + q + '&past_days=92&forecast_days=7');
    const d = await res.json();
    if (!d.daily || !d.daily.time) throw new Error('pa te dhena');
    const perDate = {};
    const forecast = [];
    const sotStr = new Date().toISOString().split('T')[0];
    d.daily.time.forEach(function(t, i) {
      const rec = {
        data: t,
        tmax: d.daily.temperature_2m_max[i],
        tmin: d.daily.temperature_2m_min[i],
        shi: d.daily.precipitation_sum[i] || 0,
        kod: d.daily.weather_code[i]
      };
      perDate[t] = rec;
      if (t >= sotStr) forecast.push(rec);
    });
    motiCache = { perDate: perDate, forecast: forecast.slice(0, 7) };
  } catch(e) {
    console.warn('moti:', e.message);
    motiCache = { perDate: {}, forecast: [], gabim: e.message };
  }
  return motiCache;
}

function motiEmoji(kod, shi) {

  if (kod === 3) return '\u2601\uFE0F';
  if (kod >= 45 && kod <= 48) return '\uD83C\uDF2B\uFE0F';
  if (kod >= 51 && kod <= 67) return '\uD83C\uDF27\uFE0F';

}

// Korrelacion Pearson
function pearson(xs, ys) {
  const n = xs.length;
  if (n < 4) return 0;
  const mx = xs.reduce(function(a,v){return a+v;},0)/n;
  const my = ys.reduce(function(a,v){return a+v;},0)/n;
  let num = 0, dx = 0, dy = 0;
  for (let i = 0; i < n; i++) {
    const a = xs[i]-mx, b = ys[i]-my;
    num += a*b; dx += a*a; dy += b*b;
  }
  return (dx && dy) ? num/Math.sqrt(dx*dy) : 0;
}

function totalDritare(dataFestes, ditePara, diteMbrapa) {

// ── ANOMALITE ──
function gjejAnomalite() {
  const out = [];
  const sotStr = new Date().toISOString().split('T')[0];

  // Ndërto seri ditore (90 ditet e fundit)
  const perDite = {};
  shitjet.forEach(function(s) {
    if (!s.data) return;
    perDite[s.data] = (perDite[s.data]||0) + (s.total||0);
  });
  const d90 = new Date(); d90.setDate(d90.getDate()-90);
  const nga = d90.toISOString().split('T')[0];
  const ditet = Object.keys(perDite).filter(function(d){ return d >= nga && d <= sotStr; }).sort();
  const vals = ditet.map(function(d){ return perDite[d]; });

  if (vals.length >= 8) {
    const mes = vals.reduce(function(a,v){return a+v;},0)/vals.length;
    const sd = Math.sqrt(vals.reduce(function(a,v){return a+Math.pow(v-mes,2);},0)/vals.length);

    // Ditet jashte modelit (30 ditet e fundit)
    const d30 = new Date(); d30.setDate(d30.getDate()-30);
    const nga30 = d30.toISOString().split('T')[0];
    ditet.filter(function(d){ return d >= nga30; }).forEach(function(d) {
      const v = perDite[d];
      const z = sd > 0 ? (v-mes)/sd : 0;
      if (z >= 2) {
        out.push({ tip:'lart', dita:d, vlera:v,
          tekst:'<b>' + dataNjerezore(d) + '</b> ishte <b>' + (v/mes).toFixed(1) + 'x</b> mbi normalen',
          val: fm(v) });
      } else if (z <= -1.9 && v > 0) {
        out.push({ tip:'poshte', dita:d, vlera:v,
          tekst:'<b>' + dataNjerezore(d) + '</b> ishte shume nen normalen',
          val: fm(v) });
      }
    });

    // Ditet pune pa asnje shitje (jo e diel)
    const dTest = new Date(); dTest.setDate(dTest.getDate()-1);
    for (let k = 0; k < 14; k++) {
      const dd = new Date(); dd.setDate(dd.getDate()-1-k);
      const ds = dd.toISOString().split('T')[0];
      if (dd.getDay() === 0) continue;
      if (ds < nga) break;
      if (!perDite[ds] && ditet.some(function(x){ return x < ds; })) {
        out.push({ tip:'zero', dita:ds, vlera:0,
          tekst:'<b>' + dataNjerezore(ds) + '</b> pa asnje shitje',
          val:'0' });
      }
    }
  }

  // Produktet qe kishin ritem dhe kane ndaluar
  const perProd = {};
  shitjet.forEach(function(s) {
    const k = (s.produkti||'').trim();
    if (!k || !s.data) return;
    if (!perProd[k]) perProd[k] = [];
    perProd[k].push(s.data);
  });
  Object.keys(perProd).forEach(function(k) {
    const datat = perProd[k].sort();
    if (datat.length < 5) return;
    const e_fundit = datat[datat.length-1];
    // ritmi mesatar mes shitjeve (te fundit 8)
    const fund = datat.slice(-9);
    let hapa = [];
    for (let i = 1; i < fund.length; i++) {
      const a = new Date(fund[i-1]+'T00:00:00'), b = new Date(fund[i]+'T00:00:00');
      const dif = Math.round((b-a)/86400000);
      if (dif > 0) hapa.push(dif);
    }
    if (hapa.length < 3) return;
    hapa.sort(function(a,b){return a-b;});
    const mediana = hapa[Math.floor(hapa.length/2)];
    const ditetNgaFundi = Math.round((new Date(sotStr+'T00:00:00') - new Date(e_fundit+'T00:00:00'))/86400000);
    if (mediana <= 10 && ditetNgaFundi >= mediana*3 && ditetNgaFundi >= 12) {
      out.push({ tip:'ngecur', dita:e_fundit, vlera:ditetNgaFundi,
        tekst:'<b>' + k + '</b> pa shitje ' + ditetNgaFundi + ' dite &mdash; me pare shitej cdo ~' + mediana + ' dite',
        val: ditetNgaFundi + 'd' });
    }
  });

  // Rendit: me te fundit / me te medhenjte
  const rendi = { lart:0, ngecur:1, zero:2, poshte:3 };
  out.sort(function(a,b) {
    if (rendi[a.tip] !== rendi[b.tip]) return rendi[a.tip]-rendi[b.tip];
    return (b.dita||'').localeCompare(a.dita||'');
  });
  return out.slice(0, 14);
}



// ── SCATTER: temperatura vs xhiro ──
function scatterMoti(pika, korr) {
  if (pika.length < 4) return '<div class="empty-sub" style="text-align:center;padding:20px">Pa te dhena te mjaftueshme</div>';
  const W = 320, H = 190, PL = 36, PB = 24, PT = 8, PR = 8;
  const iw = W-PL-PR, ih = H-PT-PB;
  const txs = pika.map(function(p){ return p.t; });
  const vys = pika.map(function(p){ return p.v; });
  const tmin = Math.floor(Math.min.apply(null,txs)/5)*5;
  const tmax = Math.ceil(Math.max.apply(null,txs)/5)*5;
  const vmax = Math.max.apply(null, vys.concat([1]));
  const X = function(t){ return PL + ((t-tmin)/((tmax-tmin)||1))*iw; };
  const Y = function(v){ return PT + ih - (v/vmax)*ih; };

  let g = '';
  for (let k = 0; k <= 3; k++) {
    const yy = PT + (ih/3)*k, vv = vmax - (vmax/3)*k;
    g += '<line class="gr" x1="'+PL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+yy.toFixed(1)+'"/>'
      + '<text class="ax" x="'+(PL-5)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end">'
      + (vv>=1000?(vv/1000).toFixed(1)+'k':Math.round(vv)) + '</text>';
  }
  const hapT = Math.max(5, Math.round((tmax-tmin)/5/5)*5);
  for (let t = tmin; t <= tmax; t += hapT) {
    g += '<text class="ax" x="'+X(t).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+t+'\u00b0</text>';
  }

  const dots = pika.map(function(p) {
    const col = p.shi >= 3 ? '#3b82f6' : (p.t >= 30 ? '#f97316' : 'var(--accent)');
    return '<circle class="pt" cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3.4" fill="'+col+'"/>';
  }).join('');

  // Vije trendi (katrore me te vogla)
  let trend = '';
  const n = pika.length;
  const sx = txs.reduce(function(a,v){return a+v;},0), sy = vys.reduce(function(a,v){return a+v;},0);
  const sxy = pika.reduce(function(a,p){return a+p.t*p.v;},0);
  const sxx = txs.reduce(function(a,v){return a+v*v;},0);
  const den = n*sxx - sx*sx;
  if (den !== 0) {
    const b = (n*sxy - sx*sy)/den, a0 = (sy - b*sx)/n;
    const y1 = a0+b*tmin, y2 = a0+b*tmax;
    trend = '<line class="trend" x1="'+X(tmin)+'" y1="'+Y(Math.max(0,Math.min(vmax,y1))).toFixed(1)
      + '" x2="'+X(tmax)+'" y2="'+Y(Math.max(0,Math.min(vmax,y2))).toFixed(1)+'"/>';
  }
  return '<svg class="sc-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+g+trend+dots+'</svg>';
}

      // Opsionet e periudhes
      const opsionet = [];
      for (let k = 0; k < 12; k++) {
        const d = new Date(_sotD); d.setMonth(d.getMonth()-k);
        const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
        opsionet.push({v:key, l: muajet[d.getMonth()] + ' ' + d.getFullYear()});

      Object.keys(byVit).sort().reverse().forEach(function(v) { opsionet.push({v:v, l:'Viti ' + v}); });

      tabContent = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">'

        + opsionet.map(function(o) { return '<option value="'+o.v+'"'+(o.v===per?' selected':'')+'>'+o.l+'</option>'; }).join('')
        + '</select></div>'
        + '<div style="background:var(--bg3);border-radius:12px;padding:18px 20px">'
        + plRresht('TE ARDHURA', '', {bold:true, color:'var(--text2)'})
        + plRresht('Shitjet bruto', fm(tv), {indent:true})
        + plRresht('Numri i shitjeve', String(shL.length), {indent:true, color:'var(--text2)'})
        + plRresht('Totali i te ardhurave', fm(tv), {bold:true, top:true, color:'var(--success)'})
        + '<div style="height:14px"></div>'
        + plRresht('KOSTOJA E MALLIT (COGS)', '', {bold:true, color:'var(--text2)'})
        + plRresht('Kosto e produkteve te shitura', '-' + fm(cg.kosto), {indent:true, color:'var(--error)'})
        + (cg.pambuluar > 0 ? plRresht('Pa cmim blerjeje ne stok', fm(cg.pambuluar), {indent:true, color:'var(--warn,#fb923c)'}) : '')
        + plRresht('FITIMI BRUTO', fm(fitimBruto), {bold:true, big:true, top:true, color: fitimBruto>=0?'var(--success)':'var(--error)'})
        + plRresht('Marzhi bruto', marzhBruto.toFixed(1) + '%', {indent:true, color:'var(--text2)'})
        + '<div style="height:14px"></div>'
        + plRresht('SHPENZIME OPERATIVE', '', {bold:true, color:'var(--text2)'})
        + plRresht('Shpenzime ditore', '-' + fm(shp.ditore), {indent:true})
        + plRresht('Shpenzime fikse (qira, rryme...)', '-' + fm(shp.fikse), {indent:true})
        + plRresht('Paga', '-' + fm(shp.paga), {indent:true})
        + plRresht('Totali i shpenzimeve', '-' + fm(shp.total), {bold:true, top:true, color:'var(--error)'})
        + '<div style="height:14px"></div>'
        + plRresht('FITIMI NETO', fm(fitimNeto), {bold:true, big:true, top:true, color: fitimNeto>=0?'var(--success)':'var(--error)'})
        + plRresht('Marzhi neto', marzhNeto.toFixed(1) + '%', {indent:true, color:'var(--text2)'})
        + '</div>'
        + (mbulim < 95 ? '<div style="margin-top:14px;padding:12px 14px;background:rgba(251,146,60,0.1);border:1px solid rgba(251,146,60,0.3);border-radius:10px;font-size:12px;color:var(--text2)">'
            + 'Vetem <strong>' + mbulim.toFixed(0) + '%</strong> e shitjeve kane cmim blerjeje ne stok. Fitimi real mund te jete i ndryshem. Shto cmimin e blerjes te produktet per saktesi.</div>' : '')
        + '<div style="margin-top:14px;display:flex;gap:10px">'
        + '<button class="btn-secondary small" onclick="eksportoPL(' + Q + per + Q + ')">Eksporto CSV</button>'
        + '<button class="btn-secondary small" onclick="dergoPLTelegram(' + Q + per + Q + ')">Dergo ne Telegram</button>'
        + '</div>';
    }

  } else if (raporteTab === 'kpi') {
    if (!financaCache) {
      tabContent = '<div class="empty-state">Duke ngarkuar...</div>';
      ngarkoFinancat().then(function() { renderRaporte(); });
    } else if (window._kpiMod === 'krahaso') {
      // ── MODALITETI: KRAHASIM ──
      const opsK2 = [];
      for (let k = 0; k < 24; k++) {
        const d = new Date(_sotD.getFullYear(), _sotD.getMonth() - k, 1);
        const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
        opsK2.push({ v:key, l: muajet[d.getMonth()].substring(0,3) + ' ' + String(d.getFullYear()).slice(2) });
      }
      const zgj = window._kpiMuajt || [];
      const lista = zgj.slice().sort().map(kpiMetrika);

      tabContent = '<div class="cmp-bar">'
        + '<div class="cmp-toggle">'
        + '<button onclick="setKpiMod(\'nje\')">Nje muaj</button>'
        + '<button class="on" onclick="setKpiMod(\'krahaso\')">Krahaso</button>'
        + '</div>'
        + '<span style="font-size:12px;color:var(--text2)">' + zgj.length + '/6 muaj</span>'
        + '</div>'
        + '<div class="cmp-chips">'
        + opsK2.map(function(o) {
            return '<button class="cmp-chip' + (zgj.indexOf(o.v) >= 0 ? ' on' : '') + '"'
              + ' data-m="' + o.v + '" onclick="toggleKpiMuaj(this.dataset.m)">' + o.l + '</button>';
          }).join('')
        + '</div>'
        + (lista.length ? tabelaKrahasimi(lista) : '<div class="empty-state">Zgjidh se paku nje muaj.</div>');

    } else {
      const _kM = window._kpiMuaj || _muajKtu;
      const _kP = (function(){
        const y = parseInt(_kM.substring(0,4)), mm = parseInt(_kM.substring(5,7)) - 1;
        const d = new Date(y, mm - 1, 1);
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      })();
      const _kEshteKtu = _kM === _muajKtu;
      const shM = shitjet.filter(function(s) { return (s.data||'').startsWith(_kM); });
      const shP = shitjet.filter(function(s) { return (s.data||'').startsWith(_kP); });
      const tvM = shM.reduce(function(a,s) { return a+(s.total||0); }, 0);
      const tvP = shP.reduce(function(a,s) { return a+(s.total||0); }, 0);
      const rritja = tvP > 0 ? ((tvM-tvP)/tvP*100) : 0;

      const aovM = shM.length ? tvM/shM.length : 0;
      const aovP = shP.length ? tvP/shP.length : 0;
      const aovDelta = aovP > 0 ? ((aovM-aovP)/aovP*100) : 0;

      // Dite aktive
      const ditetM = {};
      shM.forEach(function(s) { if (s.data) ditetM[s.data] = true; });
      const nrDite = Object.keys(ditetM).length || 1;
      const perDite = tvM / nrDite;

      // Projeksioni (vetem per muajin aktual)
      const _kY = parseInt(_kM.substring(0,4)), _kMi = parseInt(_kM.substring(5,7)) - 1;
      const ditetNeMuaj = new Date(_kY, _kMi+1, 0).getDate();
      const ditaSot = _kEshteKtu ? _sotD.getDate() : ditetNeMuaj;
      const projeksion = _kEshteKtu && ditaSot > 0 ? (tvM / ditaSot) * ditetNeMuaj : tvM;

      const cgM = llogaritCOGS(shM);
      const shpM = shpenzimetPerPeriudhe(_kM);
      const brutoM = tvM - cgM.kosto;
      const netoM = brutoM - shpM.total;
      const marzhM = tvM > 0 ? (brutoM/tvM*100) : 0;

      // Break-even
      const marzhDec = tvM > 0 ? (brutoM/tvM) : 0;
      const breakEven = marzhDec > 0 ? (shpM.total / marzhDec) : 0;
      const beArritur = tvM >= breakEven;

      // Klientet unike
      const kl = {};
      shM.forEach(function(s) { const k=(s.klienti||'').trim().toLowerCase(); if(k) kl[k]=(kl[k]||0)+1; });
      const nrKlient = Object.keys(kl).length;
      const kthyer = Object.values(kl).filter(function(n){ return n>1; }).length;
      const pctKthyer = nrKlient > 0 ? (kthyer/nrKlient*100) : 0;

      // Njesi te shitura
      const njesi = shM.reduce(function(a,s){ return a+(s.sasia||1); }, 0);

      const opsK = [];
      for (let k = 0; k < 24; k++) {
        const d = new Date(_sotD.getFullYear(), _sotD.getMonth() - k, 1);
        const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
        opsK.push({v:key, l: muajet[d.getMonth()] + ' ' + d.getFullYear()});
      }
      tabContent = '<div class="cmp-bar">'
        + '<div class="cmp-toggle">'
        + '<button class="on" onclick="setKpiMod(\'nje\')">Nje muaj</button>'
        + '<button onclick="setKpiMod(\'krahaso\')">Krahaso</button>'
        + '</div>'
        + '<select onchange="setRapVar(\'_kpiMuaj\', this.value)" style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 11px;color:var(--text);font-size:13px;font-family:inherit;margin-left:auto">'
        + opsK.map(function(o){ return '<option value="'+o.v+'"'+(o.v===_kM?' selected':'')+'>'+o.l+'</option>'; }).join('')
        + '</select></div>'
        + '<div class="section-title">TREGUESIT KRYESORE</div>'
        + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px">'
        + kpiCard('Te ardhura', fm(tvM), (tvP>0 ? pctBadge(rritja) + ' vs muaji kaluar' : 'Muaji i pare'), 'var(--accent)')
        + kpiCard('Fitimi neto', fm(netoM), 'Marzhi bruto ' + marzhM.toFixed(0) + '%', netoM>=0?'var(--success)':'var(--error)')
        + kpiCard('Mesatarja/fature', fm(aovM), (aovP>0 ? pctBadge(aovDelta) : shM.length + ' fatura'))
        + kpiCard('Shitje/dite', fm(perDite), nrDite + ' dite aktive')
        + (_kEshteKtu
            ? kpiCard('Projeksioni i muajit', fm(projeksion), 'Bazuar ne ' + ditaSot + '/' + ditetNeMuaj + ' dite')
            : kpiCard('Dite me shitje', nrDite + '/' + ditetNeMuaj, 'Muaj i mbyllur'))
        + kpiCard('Njesi te shitura', String(njesi), shM.length + ' transaksione')
        + kpiCard('Klientet unike', String(nrKlient), (nrKlient ? pctKthyer.toFixed(0) + '% te kthyer' : 'Pa emra klientesh'))
        + kpiCard('Pika e barazimit', fm(breakEven), (beArritur ? 'Arritur' : 'Mbeten ' + fm(breakEven-tvM)), beArritur?'var(--success)':'var(--warn,#fb923c)')
        + '</div>'
        + '<div style="background:var(--bg3);border-radius:12px;padding:16px">'
        + '<div class="section-title" style="margin-bottom:10px">PERMBLEDHJE</div>'
        + '<div style="font-size:13px;line-height:1.7;color:var(--text2)">'
        + '&bull; Te ardhurat e muajit jane <strong style="color:var(--text)">' + fm(tvM) + '</strong>'
        + (tvP > 0 ? ', ' + (rritja>=0?'rritje':'renie') + ' prej <strong style="color:' + (rritja>=0?'var(--success)':'var(--error)') + '">' + Math.abs(rritja).toFixed(1) + '%</strong> ndaj ' + muajet[parseInt(_kP.substring(5,7))-1] : '') + '.<br>'
        + '&bull; Cdo fature mesatarisht sjell <strong style="color:var(--text)">' + fm(aovM) + '</strong>.<br>'
        + (_kEshteKtu ? '&bull; Me kete ritem, muaji mbyllet rreth <strong style="color:var(--accent)">' + fm(projeksion) + '</strong>.<br>' : '')
        + '&bull; ' + (beArritur ? 'Shpenzimet jane mbuluar &mdash; cdo shitje tani sjell fitim.' : 'Duhen edhe <strong>' + fm(breakEven-tvM) + '</strong> per te mbuluar shpenzimet.')
        + '</div></div>';
    }

  } else if (raporteTab === 'zbulime') {
    // ═══ 1. ANOMALITE ═══
    const anom = gjejAnomalite();
    const ngjyraTip = { lart:'#22c55e', poshte:'#f97316', zero:'#f85149', ngecur:'#8b8b9a' };
    const anomHtml = anom.length
      ? anom.map(function(a) {
          return '<div class="zb-item"><div class="zb-dot" style="background:'+ngjyraTip[a.tip]+'"></div>'
            + '<div class="zb-txt">'+a.tekst+'</div>'
            + '<div class="zb-val" style="color:'+ngjyraTip[a.tip]+'">'+a.val+'</div></div>';
        }).join('')
      : '<div class="zb-txt" style="color:var(--text2);padding:8px 0">Asgje jashte modelit. Gjithcka po ecen normalisht.</div>';

    // ═══ 2. FESTAT ═══
    const vitiKtu = _sotD.getFullYear();
    const tëGjithaFestat = festatPerVit(String(vitiKtu-1)).concat(festatPerVit(String(vitiKtu)), festatPerVit(String(vitiKtu+1)));
    // Mesatarja ditore e pergjithshme
    const perDiteAll = {};
    shitjet.forEach(function(s){ if(s.data) perDiteAll[s.data] = (perDiteAll[s.data]||0)+(s.total||0); });
    const gjithaDitet = Object.keys(perDiteAll);
    const mesGjithe = gjithaDitet.length
      ? gjithaDitet.reduce(function(a,d){ return a+perDiteAll[d]; },0)/gjithaDitet.length : 0;

    // Festat e kaluara me te dhena
    const festatKaluara = tëGjithaFestat
      .filter(function(f){ return f.data < _sotD.toISOString().split('T')[0]; })
      .map(function(f) {
        const w = totalDritare(f.data, 6, 0);
        return Object.assign({}, f, { mes:w.mesatare, tot:w.total,
          x: mesGjithe > 0 ? w.mesatare/mesGjithe : 0 });
      })
      .filter(function(f){ return f.tot > 0; })
      .sort(function(a,b){ return b.x - a.x; })
      .slice(0, 8);

    // Festa e ardhshme
    const sotIso = _sotD.toISOString().split('T')[0];
    const eArdhshme = tëGjithaFestat.filter(function(f){ return f.data >= sotIso; })
      .sort(function(a,b){ return a.data.localeCompare(b.data); })[0];
    let festaNext = '';
    if (eArdhshme) {
      const ditetDeri = Math.round((new Date(eArdhshme.data+'T00:00:00') - new Date(sotIso+'T00:00:00'))/86400000);
      // Sa ka qene vitin e kaluar
      const vitPara = String(parseInt(eArdhshme.data.substring(0,4))-1) + eArdhshme.data.substring(4);
      const wPara = totalDritare(vitPara, 6, 0);
      const xPara = mesGjithe > 0 ? wPara.mesatare/mesGjithe : 0;
      // Produktet kryesore ne ate dritare
      const d0 = new Date(vitPara+'T00:00:00');
      const prodF = {};
      for (let k = -6; k <= 0; k++) {
        const d = new Date(d0); d.setDate(d.getDate()+k);
        const ds = d.toISOString().split('T')[0];
        shitjet.filter(function(s){ return s.data === ds; }).forEach(function(s) {
          const p = (s.produkti||'').trim();
          if (p) prodF[p] = (prodF[p]||0) + (s.total||0);
        });
      }
      const topF = Object.keys(prodF).sort(function(a,b){ return prodF[b]-prodF[a]; }).slice(0,3);

      festaNext = '<div class="fst-next">'
        + '<div class="fst-next-lbl">Festa e ardhshme &middot; ' + (ditetDeri === 0 ? 'sot' : 'per ' + ditetDeri + ' dite') + '</div>'
        + '<div class="fst-next-emri">' + eArdhshme.em + ' ' + eArdhshme.emri + '</div>'
        + '<div class="fst-next-txt">'
        + (wPara.tot > 0
            ? 'Vitin e kaluar, javen para kesaj feste mesatarja ditore ishte <b style="color:var(--accent)">'
              + fm(wPara.mesatare) + '</b>'
              + (xPara > 1.15 ? ' &mdash; <b style="color:var(--success)">' + xPara.toFixed(1) + 'x</b> mbi normalen.' : '.')
              + (topF.length ? '<br>Produktet me te kerkuara: <b>' + topF.join(', ') + '</b>.' : '')
              + (ditetDeri > 0 && ditetDeri <= 21 && xPara > 1.15 ? '<br><b style="color:var(--accent)">Pergatit stokun tani.</b>' : '')
            : 'Nuk ka te dhena nga viti i kaluar per kete feste.')
        + '</div></div>';
    }

    const festatHtml = festatKaluara.length
      ? festatKaluara.map(function(f) {
          const col = f.x >= 1.5 ? 'var(--success)' : (f.x >= 1.1 ? 'var(--accent)' : 'var(--text2)');
          return '<div class="fst-row"><div class="fst-em">'+f.em+'</div>'
            + '<div class="fst-info"><div class="fst-emri">'+f.emri+'</div>'
            + '<div class="fst-data">Java para &middot; ' + fm(f.mes) + '/dite &middot; ' + f.data.substring(0,4) + '</div></div>'
            + '<div class="fst-x" style="color:'+col+'">'+f.x.toFixed(1)+'x</div></div>';
        }).join('')
      : '<div class="zb-txt" style="color:var(--text2);padding:8px 0">Pa te dhena te mjaftueshme per festat.</div>';

    // ═══ 3. MOTI ═══
    let motiHtml = '';
    if (!motiCache) {
      motiHtml = '<div class="zb-txt" style="color:var(--text2);padding:12px 0">Duke marre te dhenat e motit...</div>';
      ngarkoMotin().then(function() { renderRaporte(); });
    } else if (motiCache.gabim || !Object.keys(motiCache.perDate).length) {
      motiHtml = '<div class="zb-txt" style="color:var(--text2);padding:12px 0">Te dhenat e motit nuk jane te disponueshme tani.</div>';
    } else {
      // Bashko motin me xhiron
      const pika = [];
      Object.keys(motiCache.perDate).forEach(function(d) {
        if (d > sotIso) return;
        const m = motiCache.perDate[d];
        const v = perDiteAll[d];
        if (v === undefined || m.tmax === null) return;
        pika.push({ t: m.tmax, v: v, shi: m.shi, data: d });
      });

      const korr = pearson(pika.map(function(p){return p.t;}), pika.map(function(p){return p.v;}));
      // Ditet me shi vs pa shi
      const meShi = pika.filter(function(p){ return p.shi >= 3; });
      const paShi = pika.filter(function(p){ return p.shi < 1; });
      const mShi = meShi.length ? meShi.reduce(function(a,p){return a+p.v;},0)/meShi.length : 0;
      const mThat = paShi.length ? paShi.reduce(function(a,p){return a+p.v;},0)/paShi.length : 0;
      const difShi = mThat > 0 ? (mShi-mThat)/mThat*100 : 0;
      // Vape
      const vape = pika.filter(function(p){ return p.t >= 30; });
      const mVape = vape.length ? vape.reduce(function(a,p){return a+p.v;},0)/vape.length : 0;
      const mNorm = pika.length ? pika.reduce(function(a,p){return a+p.v;},0)/pika.length : 0;

      // Parashikimi
      const ditetShk = ['Die','Hen','Mar','Mer','Enj','Pre','Sht'];
      const fcHtml = motiCache.forecast.map(function(f) {
        const dt = new Date(f.data+'T00:00:00');
        // Vleresim: mesatarja e ditës së javës, korrigjuar per shi
        const dj = dt.getDay();
        const njejta = Object.keys(perDiteAll).filter(function(d) {
          return new Date(d+'T00:00:00').getDay() === dj;
        });
        let est = njejta.length ? njejta.reduce(function(a,d){return a+perDiteAll[d];},0)/njejta.length : mNorm;
        if (f.shi >= 3 && difShi < -5) est *= (1 + difShi/100);
        if (f.tmax >= 30 && mVape > 0 && mNorm > 0) est *= (mVape/mNorm);
        const klas = f.shi >= 5 ? 'keq' : (est > mNorm*1.15 ? 'mire' : '');
        return '<div class="fc-day '+klas+'">'
          + '<div class="fc-dita">'+ditetShk[dj]+'</div>'
          + '<div class="fc-ico">'+motiEmoji(f.kod, f.shi)+'</div>'
          + '<div class="fc-temp">'+Math.round(f.tmax)+'\u00b0</div>'
          + '<div class="fc-pr">'+(f.shi>0.3?f.shi.toFixed(1)+'mm':'&mdash;')+'</div>'
          + '<div class="fc-est">~'+Math.round(est)+'</div>'
          + '</div>';
      }).join('');

      let konkluzion = '';
      if (Math.abs(korr) >= 0.3) {
        konkluzion = korr > 0
          ? 'Ditet me te ngrohta sjellin <b style="color:var(--success)">me shume</b> shitje.'
          : 'Ditet me te ngrohta sjellin <b style="color:var(--error)">me pak</b> shitje.';
      } else {
        konkluzion = 'Temperatura <b>nuk ndikon</b> dukshem ne shitje.';
      }
      if (meShi.length >= 3 && Math.abs(difShi) >= 8) {
        konkluzion += ' Ditet me shi jane <b style="color:'+(difShi<0?'var(--error)':'var(--success)')+'">'
          + (difShi<0?'':'+') + difShi.toFixed(0) + '%</b> ndaj ditëve të thata.';
      }
      if (vape.length >= 3 && mNorm > 0) {
        const dv = (mVape-mNorm)/mNorm*100;
        if (Math.abs(dv) >= 10) konkluzion += ' Mbi 30\u00b0: <b style="color:'+(dv<0?'var(--error)':'var(--success)')+'">'
          + (dv<0?'':'+') + dv.toFixed(0) + '%</b>.';
      }

      motiHtml = scatterMoti(pika, korr)
        + '<div class="gr-legjend" style="margin-top:6px">'
        + '<span><i style="background:var(--accent)"></i>Normale</span>'
        + '<span><i style="background:#3b82f6"></i>Me shi</span>'
        + '<span><i style="background:#f97316"></i>Mbi 30\u00b0</span>'
        + '</div>'
        + '<div style="margin-top:12px;padding:12px 13px;background:var(--bg3);border-radius:10px;font-size:13px;line-height:1.65;color:var(--text2)">'
        + konkluzion + '<br><span style="font-size:11px;opacity:.75">Bazuar ne ' + pika.length + ' dite &middot; korrelacioni ' + korr.toFixed(2) + '</span>'
        + '</div>'
        + '<div style="margin-top:16px"><div class="gr-titull" style="margin-bottom:9px">Java qe vjen</div>'
        + '<div class="fc-grid">' + fcHtml + '</div>'

        + '<div class="stat-card">' + icoStat('renie') + '<div class="stat-info"><span class="stat-val">' + fitMuaj.marzhi + '%</span><span class="stat-label">Marzhi Muaj</span></div></div>'
        + '<div class="stat-card">' + icoStat('kupa') + '<div class="stat-info"><span class="stat-val" data-count="' + numVal(fitVit.totalFitim) + '" data-prefix="EUR " data-dec="1">' + fm(fitVit.totalFitim) + '</span><span class="stat-label">Fitim Ky Vit</span></div></div>'

        + '<div style="background:var(--bg3);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px">'

        + '<div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:6px"><span style="color:var(--text2)">Fitim neto muaj:</span><strong style="color:var(--success)">' + fm(fitMuaj.totalFitim) + '</strong></div>'

    + '<div class="stats-grid">'

window.eksportoPL = function(per) {
  const lista = (_shitjetPlotagLoaded ? shitjetPlota : shitjet).filter(function(s) { return (s.data||'').startsWith(per); });
  const tv = lista.reduce(function(a,s) { return a+(s.total||0); }, 0);
  const cg = llogaritCOGS(lista);
  const shp = shpenzimetPerPeriudhe(per);
  const bruto = tv - cg.kosto;
  const neto = bruto - shp.total;
  const rows = [
    ['PASQYRA E FITIMIT DHE HUMBJES'],
    ['Periudha', per],
    [''],
    ['TE ARDHURA'],
    ['Shitjet bruto', tv.toFixed(2)],
    ['Numri i shitjeve', lista.length],
    [''],
    ['KOSTOJA E MALLIT'],
    ['Kosto e produkteve', cg.kosto.toFixed(2)],
    ['FITIMI BRUTO', bruto.toFixed(2)],
    ['Marzhi bruto %', tv>0?(bruto/tv*100).toFixed(1):'0'],
    [''],
    ['SHPENZIME OPERATIVE'],
    ['Shpenzime ditore', shp.ditore.toFixed(2)],
    ['Shpenzime fikse', shp.fikse.toFixed(2)],
    ['Paga', shp.paga.toFixed(2)],
    ['Totali shpenzimeve', shp.total.toFixed(2)],
    [''],
    ['FITIMI NETO', neto.toFixed(2)],
    ['Marzhi neto %', tv>0?(neto/tv*100).toFixed(1):'0']
  ];
  const csv = '\uFEFF' + rows.map(function(r) { return r.join(';'); }).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'PL_DOHA_' + per + '.csv';
  a.click();
  ok('CSV u shkarkua!');
};

async function ngarkoArkaRap() {
  try {
    const _d90a = new Date(); _d90a.setDate(_d90a.getDate()-90);
    const _d90as = _d90a.toISOString().split('T')[0];
    const snap = await getDocs(query(collection(db,'arka'), where('data','>=',_d90as), orderBy('data','desc'), limit(200)));
    const arkat = snap.docs.map(function(d) { return Object.assign({id:d.id}, d.data()); });
    const el = document.getElementById('arka-rep-wrap');
    if (!el) return;
    if (!arkat.length) { el.innerHTML = '' + emptyState('Pa raporte arke','Raportet shfaqen pasi punetoret te barazojne arken.','arka') + ''; return; }
    let h = '';
    arkat.forEach(function(a) {
      const ok2 = a.rezultati === 'ok';
      h += '<div class="top-row" style="flex-direction:column;align-items:flex-start;gap:6px;padding:14px 0">'
        + '<div style="display:flex;width:100%;justify-content:space-between;align-items:center">'
        + '<div><strong>' + (a.punetori||'-') + '</strong> <span style="font-size:12px;color:var(--text2)">' + a.data + '</span></div>'
        + '<span style="font-weight:700;color:' + (ok2?'var(--success)':'var(--error)') + '">' + (ok2?'OK':'Dallim') + '</span></div>'
        + '<div style="font-size:12px;color:var(--text2)">'
        + 'Fillim: ' + fm(a.fillimiArkes||0) + ' | Shitje: +' + fm(a.totalShitje||0)
        + (a.shumaReale !== undefined ? ' | Reale: ' + fm(a.shumaReale) : '')
        + (a.dallimi ? ' | Dallim: ' + fm(a.dallimi) : '')
        + '</div>'
        + (a.koment ? '<div style="font-size:12px;font-style:italic;color:var(--text2)">' + a.koment + '</div>' : '')
        + '</div>';
    });
    el.innerHTML = h;
  } catch(e) { console.warn('arka rep:', e.message); }
}

async function ngarkoShpenzimeRap() {
  const el = document.getElementById('shpenzime-rap-wrap');
  if (!el) return;
  try {
    const _d90sh = new Date(); _d90sh.setDate(_d90sh.getDate()-90); const _d90shs = _d90sh.toISOString().split('T')[0];
    const snap = await getDocs(query(collection(db,'shpenzime'), where('data','>=',_d90shs), orderBy('data','desc'), limit(300)));
    const te_gjitha = snap.docs.map(function(d) { return Object.assign({id:d.id}, d.data()); });
    if (!te_gjitha.length) { el.innerHTML = '<div class="empty-state">Nuk ka shpenzime.</div>'; return; }

    // Group by month
    const byMuaj = {};
    te_gjitha.forEach(function(s) {
      const muaj = (s.data||'').substring(0,7);
      if (!byMuaj[muaj]) byMuaj[muaj] = {total:0, items:[]};
      byMuaj[muaj].total += (s.shuma||0);
      byMuaj[muaj].items.push(s);
    });

    const totalGjith = te_gjitha.reduce(function(a,s) { return a+(s.shuma||0); }, 0);
    let h = '<div style="background:var(--bg3);border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;justify-content:space-between">'
      + '<span style="color:var(--text2)">Total shpenzime:</span>'
      + '<strong style="color:var(--error)">-' + fm(totalGjith) + '</strong></div>';

    Object.entries(byMuaj).sort(function(a,b) { return b[0].localeCompare(a[0]); }).forEach(function(entry) {
      const muaj = entry[0], data = entry[1];
      h += '<div style="margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border)">'
        + '<div style="display:flex;justify-content:space-between;margin-bottom:8px">'
        + '<strong style="font-size:13px">' + muaj + '</strong>'
        + '<span style="color:var(--error);font-weight:600">-' + fm(data.total) + '</span></div>';
      data.items.forEach(function(s) {
        const ora = s.krijuar && s.krijuar.seconds
          ? new Date(s.krijuar.seconds*1000).toLocaleDateString('sq',{day:'numeric',month:'short'}) : (s.data||'');
        // Ruaj foton ne fotoMap per ta hapur me id
        if (s.id && s.fotoUrl) fotoMap[s.id] = s.fotoUrl;
        h += '<div class="top-row" style="padding:6px 0">'
          + '<div class="top-info"><strong>' + (s.pershkrimi||'Shpenzim') + '</strong>'
          + '<span>' + ora + ' &bull; <span class="punetor-tag">' + (s.punetori||'-') + '</span>'
          + (s.fotoUrl ? ' &bull; <button data-sid="' + s.id + '" onclick="shfaqFotoById(this.dataset.sid)" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;padding:0;font-family:DM Sans,sans-serif">&#128247; foto</button>' : '')
          + '</span></div>'
          + '<div style="text-align:right"><div style="font-weight:700;color:var(--error)">-' + fm(s.shuma||0) + '</div>'
          + '<button data-sid="' + s.id + '" onclick="fshiShpenzimin(this.dataset.sid)" style="background:none;border:none;color:var(--error);cursor:pointer;font-size:11px;opacity:0.7">fshij</button>'
          + '</div></div>';
      });
      h += '</div>';
    });

    el.innerHTML = h;
  } catch(e) {
    el.innerHTML = '<div class="empty-state">Gabim: ' + e.message + '</div>';
  }
}

function renderGaleria() {
  if (!isAdminView()) return;
  const fotot = shitjet.filter(function(s) { return s.fotoUrl; }).sort(function(a,b) {
    return (b.krijuar?.seconds||0) - (a.krijuar?.seconds||0);
  });
  let html = '<div class="page-header"><h1 class="page-title">Galeria</h1></div>';
  if (!fotot.length) { html += '<div class="empty-state">Nuk ka foto.</div>'; }
  html += '<div class="galeria-grid">';
  fotot.forEach(function(s) {
    if (s.id && s.fotoUrl) fotoMap[s.id] = s.fotoUrl;
    const dt = s.krijuar?.seconds ? new Date(s.krijuar.seconds*1000).toLocaleDateString('sq',{day:'numeric',month:'long',year:'numeric'}) : (s.data||'-');
    html += '<div class="galeria-card" onclick="shfaqFotoById(\'' + (s.id||'') + '\')">'
      + '<img src="' + s.fotoUrl + '" alt="' + s.produkti + '" loading="lazy">'
      + '<div class="galeria-info"><strong>' + s.produkti + '</strong>'
      + '<span>' + dt + '</span>'
      + '<span>' + (s.punetori||'-') + ' &bull; ' + fm(s.total) + '</span></div></div>';
  });
  html += '</div>';

window.shkarkoCSV = function() {
  if (!shitjet.length) return err('Nuk ka te dhena!');
  const hdrs = ['Data','Produkti','Sasia','Njesia','Cmimi','Total','Klienti','Punetori','Shenimi'];
  const rows = shitjet.slice().sort(function(a,b) { return (b.data||'').localeCompare(a.data||''); }).map(function(s) {
    return [s.data||'', s.produkti||'', s.sasia||'', s.njesia||'cop',
      (s.cmimi||0).toFixed(2), (s.total||0).toFixed(2),
      s.klienti||'', s.punetori||'', s.shen||''];
  });
  const tot = shitjet.reduce(function(a,s) { return a+(s.total||0); }, 0);
  rows.push(['','','','','TOTAL',(tot).toFixed(2),'','','']);
  const csv = [hdrs].concat(rows).map(function(r) {
    return r.map(function(c) { return '"' + String(c).replace(/"/g,'""') + '"'; }).join(',');
  }).join('\r\n');
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'DOHA_Shitjet_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  ok('CSV u shkarkua!');
};

window.ekzekutoFshijBitrix = async function() {
  if (document.getElementById('konf-bitrix-inp')?.value?.trim() !== 'FSHIJ') return err('Shkruaj sakte: FSHIJ');
  document.querySelector('.modal-overlay')?.remove();
  const bitrixShitjet = shitjet.filter(function(s) { return s.punetoriUid === 'bitrix_import'; });
  if (!bitrixShitjet.length) return err('Nuk ka shitje Bitrix!');
  try {
    // Delete in chunks of 50 to avoid timeout
    const CHUNK = 50;
    for (let i = 0; i < bitrixShitjet.length; i += CHUNK) {
      await Promise.all(bitrixShitjet.slice(i, i + CHUNK).map(function(s) {
        return deleteDoc(doc(db, 'shitjet', s.id));
      }));
    }
    ok('U fshin ' + bitrixShitjet.length + ' shitje Bitrix!');
    if (currentView === 'backup') renderBackup();
  } catch(e) { err(e.message); }
};

    arkaSOT = Object.assign({}, arkaSOT, {mbyllur: true, rezultati: 'dallim'});
    const oraDallim = new Date().toLocaleTimeString('sq', {hour:'2-digit', minute:'2-digit'});
    await tg('DALLIM ne Arke - DOHA Accessories\n\nPunetori: ' + punetor + '\nData: ' + sotStr + '\nOra: ' + oraDallim + '\nFillim arkes: ' + fm(arkaSOT.fillimiArkes||0) + '\nShitjet e dites: +' + fm(totalShitje) + (kaparetSot > 0 ? '\nKapare rezervimesh: +' + fm(kaparetSot) : '') + (totalShpenzime > 0 ? '\nShpenzime: -' + fm(totalShpenzime) : '') + '\nDuhet te jete: ' + fm(gjithsejDuhej) + '\nEshte ne fakt: ' + fm(reale) + '\nDallimi: ' + fm(dallimi) + '\nArsyeja: ' + koment);
    await dergoPDFRaportDitor(sotStr, punetor, arkaSOT.fillimiArkes||0, totalShitje, gjithsejDuhej, 'dallim', dallimi, koment, totalShpenzime);
    ok('Arka u mbyll! Raporti u dergua ne Telegram.');
    if (currentView === 'dashboard') renderDashboard();
  } catch(e) { err(e.message); }
};

// ── RAPORT DITOR TELEGRAM ─────────────────────────
async function dergoPDFRaportDitor(sotStr, punetor, fillimiArkes, totalShitje, gjithsej, rezultati, dallimi, koment, totalShpenzime) {
  totalShpenzime = totalShpenzime || 0;
  try {
    const shitjetSot = shitjet.filter(function(s) { return s.data === sotStr && s.punetori === punetor; });
    const oraHapur = arkaSOT && arkaSOT.krijuar && arkaSOT.krijuar.seconds
      ? new Date(arkaSOT.krijuar.seconds * 1000).toLocaleTimeString('sq', {hour:'2-digit', minute:'2-digit'})
      : '--:--';
    const oraMbyllur = new Date().toLocaleTimeString('sq', {hour:'2-digit', minute:'2-digit'});

    // Lista produkteve
    const byProd = {};
    shitjetSot.forEach(function(s) {
      const pk = (s.produkti||'').toLowerCase().trim();
      if (!byProd[pk]) byProd[pk] = {sasi:0, total:0, emri:s.produkti||''};
      byProd[pk].sasi += (s.sasia||0);
      byProd[pk].total += (s.total||0);
    });
    const prodSorted = Object.values(byProd).sort(function(a,b) { return b.total-a.total; });
    let prodLines = '';
    prodSorted.forEach(function(d) {
      prodLines += '  ' + d.emri + ' x' + d.sasi + ' = ' + fm(d.total) + '\n';
    });
    if (!prodLines) prodLines = '  (Nuk ka shitje)\n';

    // Produkti yll i dites
    const yll = prodSorted.length ? prodSorted[0].emri + ' (' + prodSorted[0].sasi + ' cope, ' + fm(prodSorted[0].total) + ')' : null;

    // Shitja me e madhe
    const maxShitje = shitjetSot.reduce(function(max, s) { return (s.total||0) > (max.total||0) ? s : max; }, {total:0});

    // Historiku i punetorit
    const shitjetPunetor = shitjet.filter(function(s) { return s.punetori === punetor && s.data && s.data !== sotStr; });
    const totalPerDite = {};
    shitjetPunetor.forEach(function(s) {
      if (!totalPerDite[s.data]) totalPerDite[s.data] = 0;
      totalPerDite[s.data] += (s.total||0);
    });

    // Mesatare muaji
    const muaj = sotStr.substring(0,7);
    const shitjetMuaj = shitjet.filter(function(s) { return (s.data||'').startsWith(muaj) && s.data !== sotStr; });
    const ditetMuaj = [...new Set(shitjetMuaj.map(function(s) { return s.data; }))];
    const mesatareMuaj = ditetMuaj.length > 0
      ? shitjetMuaj.reduce(function(a,s) { return a+(s.total||0); }, 0) / ditetMuaj.length : 0;

    // Rekord personal
    const rekordi = Object.values(totalPerDite).length ? Math.max.apply(null, Object.values(totalPerDite)) : 0;

    // Streak - dite rresht mbi mesatare
    let streak = 0;
    if (mesatareMuaj > 0) {
      const ditetSort = Object.entries(totalPerDite).sort(function(a,b) { return b[0].localeCompare(a[0]); });
      for (var i = 0; i < ditetSort.length; i++) {
        if (ditetSort[i][1] >= mesatareMuaj) streak++;
        else break;
      }
    }

    // Dita e javes historike
    const sotDate = new Date(sotStr + 'T12:00:00');
    const ditetJavesEmri = ['E Diel','E Hene','E Marte','E Merkure','E Enjte','E Premte','E Shtune'];
    const ditaJaves = ditetJavesEmri[sotDate.getDay()];
    const ditetNjejta = Object.entries(totalPerDite).filter(function(e) {
      return new Date(e[0]+'T12:00:00').getDay() === sotDate.getDay();
    });
    const mesatareDitaJaves = ditetNjejta.length > 0
      ? ditetNjejta.reduce(function(a,e) { return a+e[1]; }, 0) / ditetNjejta.length : 0;

    // E njejta dite java e kaluar
    const javEKaluar = new Date(sotDate); javEKaluar.setDate(sotDate.getDate()-7);
    const javEKaluarStr = javEKaluar.toISOString().split('T')[0];
    const totalJavaKaluar = totalPerDite[javEKaluarStr] || 0;

    // Ditet e mbetura te muajit
    const ditetKaluara = ditetMuaj.length + 1;
    const totalMuajDeriTani = shitjetMuaj.reduce(function(a,s) { return a+(s.total||0); }, 0) + totalShitje;
    const ditetMbetura = Math.max(0, 26 - ditetKaluara);
    const nevojitetPerDite = ditetMbetura > 0 && mesatareMuaj > 0
      ? Math.max(0, (mesatareMuaj * 26 - totalMuajDeriTani) / ditetMbetura) : 0;

    // Efikasiteti
    let efikasiteti = '';
    if (arkaSOT && arkaSOT.krijuar && arkaSOT.krijuar.seconds && shitjetSot.length > 0) {
      const oretPune = (Date.now() - arkaSOT.krijuar.seconds * 1000) / 3600000;
      if (oretPune > 0.5) efikasiteti = (shitjetSot.length / oretPune).toFixed(1) + ' shitje/ore';
    }

    // Nderto komentet
    const komentet = [];

    // 1. Vleresim kryesor i dites
    if (shitjetSot.length === 0) {
      komentet.push('Sot nuk u be asnje shitje.');
    } else if (mesatareMuaj > 0) {
      const diff = ((totalShitje - mesatareMuaj) / mesatareMuaj * 100);
      if (totalShitje >= mesatareMuaj * 1.3) {
        komentet.push('Dite shkelqyese! +' + diff.toFixed(0) + '% mbi mesataren e muajit (' + fm(mesatareMuaj) + '/dite). Keshtu duhet!');
      } else if (totalShitje >= mesatareMuaj * 1.05) {
        komentet.push('Dite e mire! +' + diff.toFixed(0) + '% mbi mesataren e muajit (' + fm(mesatareMuaj) + '/dite).');
      } else if (totalShitje >= mesatareMuaj * 0.8) {
        komentet.push('Dite normale, afer mesatares se muajit (' + fm(mesatareMuaj) + '/dite).');
      } else {
        komentet.push('Dite me pak shitje se zakonisht, ' + Math.abs(diff).toFixed(0) + '% nen mesataren (' + fm(mesatareMuaj) + '/dite).');
      }
    }

    // 2. Rekord personal
    if (totalShitje > rekordi && rekordi > 0) {
      komentet.push('REKORD PERSONAL! Dita juaj me e mire ndonjehere!');
    } else if (rekordi > 0 && totalShitje >= rekordi * 0.9) {
      komentet.push('Shume afer rekordit personal (' + fm(rekordi) + '). Vetem ' + fm(rekordi - totalShitje) + ' larg!');
    }

    // 3. Streak
    if (streak >= 3) {
      komentet.push(streak + ' dite rresht mbi mesatare - vazhdoni keshtu!');
    }

    // 4. Kontekst dite javes
    if (mesatareDitaJaves > 0 && shitjetSot.length > 0) {
      const diffJave = ((totalShitje - mesatareDitaJaves) / mesatareDitaJaves * 100);
      if (totalShitje >= mesatareDitaJaves * 1.15) {
        komentet.push(ditaJaves + ' historikisht mesatarisht ' + fm(mesatareDitaJaves) + ' - sot e kalonit!');
      } else if (totalShitje < mesatareDitaJaves * 0.85) {
        komentet.push(ditaJaves + ' zakonisht ' + fm(mesatareDitaJaves) + ' - sot pak me dobet se zakoni.');
      }
    }

    // 5. Krahasim java e kaluar
    if (totalJavaKaluar > 0 && shitjetSot.length > 0) {
      const diffJk = ((totalShitje - totalJavaKaluar) / totalJavaKaluar * 100);
      if (Math.abs(diffJk) >= 15) {
        const shenjJk = diffJk >= 0 ? '+' : '';
        komentet.push(ditaJaves + ' e kaluar: ' + fm(totalJavaKaluar) + ' (' + shenjJk + diffJk.toFixed(0) + '% ndryshim).');
      }
    }

    // 6. Produkti yll
    if (yll && shitjetSot.length > 0) {
      komentet.push('Ylli i dites: ' + yll + '.');
    }

    // 7. Shitja me e madhe
    if (maxShitje.total > 0 && maxShitje.produkti) {
      komentet.push('Shitja me e madhe: ' + maxShitje.produkti + ' ' + fm(maxShitje.total) + '.');
    }

    // 8. Efikasiteti
    if (efikasiteti) {
      komentet.push('Ritmi i dites: ' + efikasiteti + '.');
    }

    // 9. Motivim per ditet e mbetura
    if (ditetMbetura > 0 && nevojitetPerDite > 0 && shitjetSot.length > 0) {
      komentet.push('Muaji: ' + fm(totalMuajDeriTani) + ' deri tani. Nevojiten ~' + fm(nevojitetPerDite) + '/dite per ' + ditetMbetura + ' ditet e mbetura.');
    }

    // 10. Motivim kur mungon pak per mesatare
    if (mesatareMuaj > 0 && totalShitje < mesatareMuaj && (mesatareMuaj - totalShitje) <= mesatareMuaj * 0.15) {
      komentet.push('Edhe ' + fm(mesatareMuaj - totalShitje) + ' dhe e kalonit mesataren e muajit!');
    }

    const statusLine = rezultati === 'ok' ? 'BARAZUAR' : 'DALLIM ' + fm(dallimi) + ' | ' + koment;

    const msg = 'RAPORT DITOR - DOHA Accessories\n'
      + 'Punetori: ' + punetor + '\n'
      + 'Data: ' + sotStr + '  |  ' + oraHapur + ' - ' + oraMbyllur + '\n'
      + '----------------------------\n'
      + prodLines
      + '----------------------------\n'
      + 'Fillim arkes: ' + fm(fillimiArkes) + '\n'
      + 'Total shitje: ' + fm(totalShitje) + '\n'
      + (totalShpenzime > 0 ? 'Shpenzime: -' + fm(totalShpenzime) + '\n' : '')
      + 'Gjithsej ne arke: ' + fm(gjithsej) + '\n'
      + 'Arka: ' + statusLine + '\n'
      + '----------------------------\n'
      + komentet.join('\n');

    await tg(msg);
  } catch(e) { console.warn('raport ditor:', e.message); }
}

// ── EXCEL EXPORT ──────────────────────────────────
window.shkarkoExcel = function(dataFillim, dataMbarim) {
  const lista = shitjet.filter(function(s) {
    return s.data >= dataFillim && s.data <= dataMbarim;
  });
  if (!lista.length) return err('Nuk ka shitje per kete periudhe!');

  const byPunetor = {};
  lista.forEach(function(s) {
    if (!byPunetor[s.punetori]) byPunetor[s.punetori] = 0;
    byPunetor[s.punetori] += (s.total||0);
  });
  const byDate = {};
  lista.forEach(function(s) {
    if (!byDate[s.data]) byDate[s.data] = 0;
    byDate[s.data] += (s.total||0);
  });

  const BOM = '\uFEFF';
  let csv = BOM + 'Data,Produkti,Sasia,Njesia,Cmimi EUR,Total EUR,Punetori,Klienti,Shenimi\n';
  lista.sort(function(a,b) { return a.data.localeCompare(b.data); }).forEach(function(s) {
    const row = [
      s.data, '"' + (s.produkti||'').replace(/"/g,'""') + '"',
      (s.sasia||0), (s.njesia||'cop'),
      (s.cmimi||0).toFixed(2), (s.total||0).toFixed(2),
      (s.punetori||''), '"' + (s.klienti||'').replace(/"/g,'""') + '"',
      '"' + (s.shen||'').replace(/"/g,'""') + '"'
    ];
    csv += row.join(',') + '\n';
  });

  // Summary sheet at bottom
  csv += '\n\nPERMBLEDHJA\n';
  csv += 'Punetori,Total EUR\n';
  Object.entries(byPunetor).sort(function(a,b) { return b[1]-a[1]; }).forEach(function(e) {
    csv += e[0] + ',' + e[1].toFixed(2) + '\n';
  });
  csv += '\nData,Total EUR\n';
  Object.entries(byDate).sort(function(a,b) { return a[0].localeCompare(b[0]); }).forEach(function(e) {
    csv += e[0] + ',' + e[1].toFixed(2) + '\n';
  });
  csv += '\nGJITHSEJ,' + lista.reduce(function(a,s) { return a+(s.total||0); }, 0).toFixed(2) + '\n';

  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'DOHA_' + dataFillim + '_' + dataMbarim + '.csv';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  ok('Excel u shkarkua!');
};
