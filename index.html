let etkMadhesia = 'mesme';
let etkTreguEmrin = true;

window.hapEtiketat = function() {
  etkZgjedhur = {};
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'modal-etk';
  ov.innerHTML = '<div class="modal-box" style="max-width:520px">'
    + modalHead('Etiketa Cmimesh', 'Zgjidh produktet dhe printo ne A4')
    + '<div class="form-group" style="margin-bottom:10px">'
    + '<input type="text" id="etk-kerkim" placeholder="Kerko produkt..." oninput="etkFiltro()">'
    + '</div>'
    + '<div class="etk-opt">'
    + '<button id="etk-m-vogel" onclick="etkSetMadhesi(\'vogel\')">Vogel &middot; 5/rr</button>'
    + '<button id="etk-m-mesme" class="on" onclick="etkSetMadhesi(\'mesme\')">Mesme &middot; 4/rr</button>'
    + '<button id="etk-m-madhe" onclick="etkSetMadhesi(\'madhe\')">Madhe &middot; 3/rr</button>'
    + '</div>'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
    + '<button class="btn-secondary small" onclick="etkZgjidhTeGjitha()">Zgjidh te gjitha</button>'
    + '<span id="etk-info" style="font-size:12px;color:var(--text2)">0 te zgjedhura</span>'
    + '</div>'
    + '<div class="etk-lista" id="etk-lista"></div>'
    + '<div style="display:flex;gap:10px">'
    + '<button class="btn-secondary" style="flex:1" onclick="document.getElementById(\'modal-etk\').remove()">Mbyll</button>'
    + '<button class="btn-primary" style="flex:1.4" onclick="printoEtiketat()">Printo</button>'
    + '</div></div>';
  document.body.appendChild(ov);
  etkFiltro();
};

window.etkSetMadhesi = function(m) {
  etkMadhesia = m;
  ['vogel','mesme','madhe'].forEach(function(k) {
    const b = document.getElementById('etk-m-' + k);
    if (b) b.classList.toggle('on', k === m);
  });
};

function etkProduktet() {
  return stock.filter(function(p) { return p.lloji !== 'set'; })
    .sort(function(a,b) { return (a.emri||'').localeCompare(b.emri||''); });
}

window.etkFiltro = function() {
  const q = (document.getElementById('etk-kerkim')?.value || '').toLowerCase().trim();
  const lista = etkProduktet().filter(function(p) {
    return !q || (p.emri||'').toLowerCase().includes(q);
  });
  const el = document.getElementById('etk-lista');
  if (!el) return;
  if (!lista.length) {
    el.innerHTML = '<div style="padding:22px;text-align:center;color:var(--text2);font-size:13px">Pa produkte</div>';
    return;
  }
  el.innerHTML = lista.map(function(p) {
    const sel = !!etkZgjedhur[p.id];
    return '<div class="etk-row' + (sel ? ' sel' : '') + '" data-pid="' + p.id + '" onclick="etkToggle(this.dataset.pid)">'
      + '<div class="etk-chk">&#10003;</div>'
      + '<div class="etk-emri">' + (p.emri||'') + '</div>'
      + '<div class="etk-cmim">' + fm(p.cmimiShitjes||0) + '</div>'
      + '</div>';
  }).join('');
  etkInfo();
};

window.etkToggle = function(id) {
  if (etkZgjedhur[id]) delete etkZgjedhur[id];
  else etkZgjedhur[id] = 1;
  etkFiltro();
};

window.etkZgjidhTeGjitha = function() {
  const q = (document.getElementById('etk-kerkim')?.value || '').toLowerCase().trim();
  const lista = etkProduktet().filter(function(p) { return !q || (p.emri||'').toLowerCase().includes(q); });
  const tePlota = lista.every(function(p) { return etkZgjedhur[p.id]; });
  lista.forEach(function(p) {
    if (tePlota) delete etkZgjedhur[p.id];
    else etkZgjedhur[p.id] = 1;
  });
  etkFiltro();
};

function etkInfo() {
  const n = Object.keys(etkZgjedhur).length;
  const el = document.getElementById('etk-info');
  if (el) el.textContent = n + (n === 1 ? ' e zgjedhur' : ' te zgjedhura');
}

window.printoEtiketat = function() {
  const idet = Object.keys(etkZgjedhur);
  if (!idet.length) return err('Zgjidh se paku nje produkt!');
  const prods = stock.filter(function(p) { return etkZgjedhur[p.id]; })
    .sort(function(a,b) { return (a.emri||'').localeCompare(b.emri||''); });

  const P = {
    vogel: { kol:5, h:26, hEmri:8.2,  hCmimi:13, hVal:6.2, pad:'2.6mm 2mm'   },
    mesme: { kol:4, h:33, hEmri:9.6,  hCmimi:17, hVal:7,   pad:'3.2mm 2.4mm' },
    madhe: { kol:3, h:44, hEmri:11.5, hCmimi:23, hVal:8.4, pad:'4mm 3mm'     }
  }[etkMadhesia];

  const cel = prods.map(function(p) {
    const emri = String(p.emri||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return '<div class="lbl">'
      + '<div class="lbl-brand">DOHA<span class="ln"></span></div>'
      + '<div class="lbl-emri">' + emri + '</div>'
      + '<div class="lbl-cmimi"><span class="val">' + (p.cmimiShitjes||0).toFixed(2) + '</span><span class="cur">EUR</span></div>'
      + '</div>';
  }).join('');

  const html = '<!DOCTYPE html><html lang="sq"><head><meta charset="utf-8">'
    + '<title>Etiketa \u2014 DOHA Accessories</title>'
    + '<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">'
    + '<style>'
    + '@page { size:A4; margin:8mm }'
    + '*{box-sizing:border-box;margin:0;padding:0}'
    + 'body{font-family:"DM Sans",Arial,sans-serif;background:#fff;color:#111;padding:8mm}'
    + '.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;'
    + ' background:#f5f3ed;border:1px solid #e0dbcf;border-radius:9px;margin-bottom:12px;font-size:12.5px;color:#5a5a5a}'
    + '.bar b{color:#111}'
    + '.bar button{background:#c8993a;color:#fff;border:none;border-radius:7px;padding:9px 20px;'
    + ' font:600 13px "DM Sans",Arial,sans-serif;cursor:pointer;white-space:nowrap}'
    + '.grid{display:grid;grid-template-columns:repeat(' + P.kol + ',1fr);gap:2.5mm}'
    + '.lbl{border:1px dashed #cdc8bb;border-radius:1.5mm;padding:' + P.pad + ';text-align:center;'
    + ' display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.2mm;'
    + ' height:' + P.h + 'mm;page-break-inside:avoid;break-inside:avoid}'
    + '.lbl-brand{font-family:"DM Serif Display",Georgia,serif;font-size:' + (P.hEmri-2) + 'pt;'
    + ' letter-spacing:2.6px;color:#b08b30;text-transform:uppercase;line-height:1}'
    + '.ln{display:block;width:9mm;height:.4mm;background:#ddd0a8;margin:1mm auto 0}'
    + '.lbl-emri{font-size:' + P.hEmri + 'pt;font-weight:600;line-height:1.2;word-break:break-word}'
    + '.lbl-cmimi{display:flex;align-items:baseline;justify-content:center;gap:.8mm;'
    + ' border-top:1px solid #e6e1d6;padding-top:1.3mm;width:82%}'
    + '.lbl-cmimi .val{font-size:' + P.hCmimi + 'pt;font-weight:700;letter-spacing:-.5px;line-height:1}'
    + '.lbl-cmimi .cur{font-size:' + P.hVal + 'pt;font-weight:600;color:#8a8a8a}'
    + '@media print{.bar{display:none!important}body{padding:0}}'
    + '</style></head><body>'
    + '<div class="bar"><span><b>' + prods.length + '</b> etiketa \u00b7 madhesia <b>' + etkMadhesia + '</b> \u00b7 '
    + P.kol + ' ne rresht</span><button onclick="window.print()">Printo</button></div>'
    + '<div class="grid">' + cel + '</div>'
    + '</body></html>';

  const w = window.open('', '_blank');
  if (!w) return err('Lejo dritaret pop-up per te printuar!');
  w.document.open(); w.document.write(html); w.document.close();
  setTimeout(function(){ try { w.focus(); w.print(); } catch(e) {} }, 900);
  ok(prods.length + ' etiketa gati');
};


function renderStock() {
  if (!isAdminView()) return;
  const totalProduktet = stock.length;
  const totalVlera = stock.reduce(function(a,p) { return a + (p.cmimiBlerjes||0) * (p.sasia||0); }, 0);
  const totalShitje = stock.reduce(function(a,p) { return a + (p.cmimiShitjes||0) * (p.sasia||0); }, 0);
  const fitimPotencial = totalShitje - totalVlera;
  const stokuUlet = stock.filter(function(p) { return p.lloji !== 'set' && (p.sasia||0) <= (p.sasiaMin||3); });
  const paCmimBlerjes = stock.filter(function(p) { return p.lloji !== 'set' && (p.cmimiBlerjes === null || p.cmimiBlerjes === undefined || p.cmimiBlerjes === ''); });

  // Filter stock
  const filtered = stock.filter(function(p) {
    const matchKerkim = !stockFilter.kerkim || (p.emri||'').toLowerCase().includes(stockFilter.kerkim.toLowerCase());
    const matchKat = !stockFilter.kategoria || p.kategoriaId === stockFilter.kategoria;
    return matchKerkim && matchKat;
  });

  // Kategori tabs — shfaq pemën
  const tree = buildKatTree();
  let katTabs = '<button class="rtab ' + (!stockFilter.kategoria ? 'active' : '') + '" onclick="filtroProd(\'\')">Te gjitha</button>';
  function addKatTab(nodes, level) {
    nodes.forEach(function(k) {
      const prefix = level > 0 ? '&nbsp;'.repeat(level*2) + '▸ ' : '';
      katTabs += '<button class="rtab ' + (stockFilter.kategoria === k.id ? 'active' : '') + '" data-kid="' + k.id + '" onclick="filtroProd(this.dataset.kid)" ondragover="event.preventDefault();this.style.outline=\'2px solid var(--accent)\'" ondragleave="this.style.outline=\'\'" ondrop="dropNeProd(event,this.dataset.kid);this.style.outline=\'\'" style="font-size:' + (level===0?'13':'12') + 'px">' + prefix + k.emri + '</button>';
      addKatTab(tree.getChildren(k.id), level + 1);
    });
  }
  addKatTab(tree.roots, 0);

  // Analitika — produktet qe nuk levizin
  const sot = new Date().toISOString().split('T')[0];
  const para30 = new Date(); para30.setDate(para30.getDate()-30);
  const para30Str = para30.toISOString().split('T')[0];
  const shitjetSipasStok = {};
  shitjet.forEach(function(s) {
    if (!s.stockId || !s.data) return;
    if (s.data >= para30Str) {
      shitjetSipasStok[s.stockId] = (shitjetSipasStok[s.stockId]||0) + (s.sasia||1);
    }
  });
  // Rotacion — dite mesatare para shitjes
  const rotacionData = {};
  shitjet.forEach(function(s) {
    if (!s.stockId || !s.krijuar || !s.krijuar.seconds) return;
    const p = stock.find(function(x) { return x.id === s.stockId; });
    if (!p || !p.krijuar || !p.krijuar.seconds) return;
    const ditePritje = Math.round((s.krijuar.seconds - p.krijuar.seconds) / 86400);
    if (ditePritje >= 0 && ditePritje < 365) {
      if (!rotacionData[s.stockId]) rotacionData[s.stockId] = [];
      rotacionData[s.stockId].push(ditePritje);
    }
  });

  // Build LIST or GRID view
  let rows = '';
  const eshteGrid = stockFilter.pamje === 'grid';

  if (eshteGrid) {
    rows = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px">';
    filtered.forEach(function(p) {
      const ulët = p.lloji !== 'set' && (p.sasia||0) <= (p.sasiaMin||3);
      const mbaroi = p.lloji !== 'set' && (p.sasia||0) === 0;
      const eshteSet = p.lloji === 'set';
      const statusColor = mbaroi ? '#ef4444' : ulët ? '#f97316' : '#22c55e';
      const paBlerje = !eshteSet && (p.cmimiBlerjes === null || p.cmimiBlerjes === undefined || p.cmimiBlerjes === '');
      rows += '<div draggable="true" data-sid="' + p.id + '" ondragstart="dragStartProd(event,this.dataset.sid)" ondragover="event.preventDefault()" style="background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:relative;cursor:grab" onclick="editoStockun(\'' + p.id + '\')">'
        + '<div style="position:absolute;top:8px;right:8px;width:10px;height:10px;border-radius:50%;background:' + (eshteSet ? 'var(--accent2)' : statusColor) + ';box-shadow:0 0 6px ' + (eshteSet ? 'var(--accent2)' : statusColor) + '"></div>'
        + (p.fotoUrl
          ? '<img src="' + p.fotoUrl + '" style="width:100%;height:120px;object-fit:cover" onclick="event.stopPropagation();zoomFotoSrc(this.src)">'
          : '<div style="width:100%;height:120px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:36px">&#128247;</div>')
        + '<div style="padding:10px">'
        + '<div style="font-weight:600;font-size:13px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + p.emri + '</div>'
        + '<div style="font-size:12px;color:var(--accent);font-weight:600">' + fm(p.cmimiShitjes||0) + '</div>'
        + '<div style="font-size:11px;color:' + (eshteSet ? 'var(--accent2)' : statusColor) + ';margin-top:2px">' + (eshteSet ? 'SET' : (p.sasia||0) + ' cope') + '</div>'
        + (paBlerje ? '<div style="font-size:10px;color:#f59e0b;margin-top:2px">Pa cmim blerjes</div>' : '')
        + '</div></div>';
    });
    rows += '</div>';
    if (!filtered.length) rows = '<div class="empty-state">Nuk ka produkte.</div>';
  } else {
    filtered.forEach(function(p) {
      const ulët = p.lloji !== 'set' && (p.sasia||0) <= (p.sasiaMin||3);
      const mbaroi = p.lloji !== 'set' && (p.sasia||0) === 0;
      const eshteSet = p.lloji === 'set';
      const paBlerje = !eshteSet && (p.cmimiBlerjes === null || p.cmimiBlerjes === undefined || p.cmimiBlerjes === '');
      const marzhi = p.cmimiShitjes > 0 && !eshteSet && !paBlerje ? (((p.cmimiShitjes - p.cmimiBlerjes) / p.cmimiShitjes) * 100).toFixed(0) : null;
      const marzhiColor = marzhi >= 40 ? 'var(--success)' : marzhi >= 20 ? 'var(--accent)' : 'var(--error)';
      const statusColor = mbaroi ? 'var(--error)' : ulët ? '#f97316' : 'var(--success)';
      const setBadge = eshteSet ? '<span style="background:rgba(251,146,60,0.2);color:var(--accent2);font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;margin-left:6px">SET</span>' : '';
      const paBlerjeB = paBlerje ? '<span style="background:rgba(251,191,36,0.2);color:#f59e0b;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;margin-left:4px">Pa cmim blerjes</span>' : '';
      const kat = kategorite.find(function(k) { return k.id === p.kategoriaId; });
      const katBadge = kat ? '<span style="background:var(--bg3);color:var(--text2);font-size:10px;padding:2px 8px;border-radius:20px;margin-left:4px">' + kat.emri + '</span>' : '';
      const fotoThumb = p.fotoUrl
        ? '<img src="' + p.fotoUrl + '" style="width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;cursor:zoom-in" onclick="event.stopPropagation();zoomFotoSrc(this.src)">'
        : '<div style="width:44px;height:44px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">&#128247;</div>';
      const setProd = eshteSet && p.produktet ? p.produktet.map(function(pr) { return pr.emri + ' ' + fm(pr.cmimi); }).join(', ') : '';
      // Status dot
      const dot = '<span style="width:8px;height:8px;border-radius:50%;background:' + (eshteSet ? 'var(--accent2)' : statusColor) + ';display:inline-block;margin-right:4px;flex-shrink:0"></span>';
      rows += '<div class="top-row" draggable="true" data-sid="' + p.id + '" ondragstart="dragStartProd(event,this.dataset.sid)" ondragover="event.preventDefault()" style="gap:10px;cursor:grab;' + (ulët && !mbaroi ? 'border-left:3px solid #f97316;padding-left:10px' : mbaroi ? 'border-left:3px solid var(--error);padding-left:10px' : '') + '">'
        + fotoThumb
        + '<div class="top-info" style="flex:1">'
        + '<strong>' + dot + p.emri + setBadge + paBlerjeB + katBadge + '</strong>'
        + '<span>'
        + (eshteSet
          ? '<span style="color:var(--text2)">' + setProd + '</span>'
          : '<span style="color:' + statusColor + ';font-weight:600">' + (mbaroi ? 'MBAROI' : (p.sasia||0) + ' cope') + '</span>'
            + (!paBlerje ? ' &bull; Blerje: ' + fm(p.cmimiBlerjes||0) + ' &bull; <span style="color:' + marzhiColor + '">Marzhi: ' + marzhi + '%</span>' : ''))
        + ' &bull; Shitje: ' + fm(p.cmimiShitjes||0)
        + '</span></div>'
        + '<div style="display:flex;gap:8px;align-items:center">'
        + '<div class="top-total">' + fm(p.cmimiShitjes||0) + '</div>'
        + '<button data-sid="' + p.id + '" onclick="event.stopPropagation();shfaqHistorikunLevizjeve(this.dataset.sid)" class="edit-btn" title="Historiku" style="font-size:12px">&#128203;</button>'
        + '<button data-sid="' + p.id + '" onclick="event.stopPropagation();shfaqQR(this.dataset.sid)" class="edit-btn" title="QR Kod" style="font-size:12px">&#9638;</button>'
        + '<button data-sid="' + p.id + '" onclick="event.stopPropagation();editoStockun(this.dataset.sid)" class="edit-btn">&#9998;</button>'
        + '<button data-sid="' + p.id + '" onclick="event.stopPropagation();fshijStockun(this.dataset.sid)" class="del-btn">&#10005;</button>'
        + '</div></div>';
    });
    if (!rows) rows = '<div class="empty-state">Nuk ka produkte.</div>';
  }

  document.getElementById('content').innerHTML =
    '<div class="page-header"><h1 class="page-title">Stock</h1>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap">'
    + '<button class="btn-secondary small" onclick="hapEtiketat()">&#127991; Etiketa</button>'
    + '<button class="btn-secondary small" onclick="menaxhoKategorite()">&#128193; Kategorite</button>'
    + '<button class="btn-secondary small" onclick="shtoSetModal()">+ Set i Ri</button>'
    + '<button class="btn-primary small" onclick="shtoStockModal()">+ Produkt i Ri</button>'
    + '</div></div>'
    + '<div class="stats-grid">'
    + '<div class="stat-card accent">' + icoStat('kuti') + '<div class="stat-info"><span class="stat-val" data-count="' + numVal(totalProduktet) + '">' + totalProduktet + '</span><span class="stat-label">Produkte</span></div></div>'
    + '<div class="stat-card">' + icoStat('para') + '<div class="stat-info"><span class="stat-val" data-count="' + numVal(totalVlera) + '" data-prefix="EUR " data-dec="1">' + fm(totalVlera) + '</span><span class="stat-label">Vlera Blerjes</span></div></div>'
    + '<div class="stat-card gold">' + icoStat('rritje') + '<div class="stat-info"><span class="stat-val" data-count="' + numVal(fitimPotencial) + '" data-prefix="EUR " data-dec="1">' + fm(fitimPotencial) + '</span><span class="stat-label">Fitim Potencial</span></div></div>'
    + '</div>'
    + (stokuUlet.length ? '<div class="info-box" style="border-color:#f97316;color:#f97316;margin-bottom:10px">&#9888; ' + stokuUlet.length + ' produkte me stock te ulet: ' + stokuUlet.map(function(p) { return p.emri + ' (' + p.sasia + ')'; }).join(', ') + '</div>' : '')
    + (paCmimBlerjes.length ? '<div class="info-box" style="border-color:#f59e0b;color:#f59e0b;margin-bottom:10px">&#9432; ' + paCmimBlerjes.length + ' produkte pa cmim blerjes: ' + paCmimBlerjes.map(function(p) { return p.emri; }).join(', ') + '</div>' : '')
    + '<div class="form-card">'
    // Search + view toggle
    + '<div style="display:flex;gap:8px;margin-bottom:12px">'
    + '<input type="text" id="stock-kerkim" placeholder="Kerko produkt..." value="' + (stockFilter.kerkim||'') + '" oninput="kerkoProdStock(this.value)" style="flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:11px;color:var(--text);font-family:DM Sans,sans-serif;outline:none;box-sizing:border-box">'
    + '<button onclick="stockFilter.pamje=\'list\';renderStock()" style="background:' + (stockFilter.pamje==='list'?'var(--accent)':'var(--bg3)') + ';border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:' + (stockFilter.pamje==='list'?'#111':'var(--text)') + ';cursor:pointer;font-size:16px" title="List">&#9776;</button>'
    + '<button onclick="stockFilter.pamje=\'grid\';renderStock()" style="background:' + (stockFilter.pamje==='grid'?'var(--accent)':'var(--bg3)') + ';border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:' + (stockFilter.pamje==='grid'?'#111':'var(--text)') + ';cursor:pointer;font-size:16px" title="Grid">&#9638;</button>'
    + '<button onclick="shfaqAnalitiken()" style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;color:var(--text);cursor:pointer;font-size:16px" title="Analitike">&#128202;</button>'
    + '</div>'
    + (kategorite.length ? '<div class="raporte-tabs" style="margin-bottom:12px;flex-wrap:wrap" id="kat-tabs-zone">' + katTabs
      + '<div class="rtab" ondragover="event.preventDefault();this.style.background=\'var(--bg3)\'" ondragleave="this.style.background=\'\'" ondrop="dropNeProd(event,\'\')" style="border:2px dashed var(--border);color:var(--text2);cursor:copy" title="Hiq nga kategoria">Pa kategori</div>'
      + '</div>' : '')
    // Legend
    + '<div style="display:flex;gap:12px;font-size:11px;color:var(--text2);margin-bottom:10px;flex-wrap:wrap">'
    + '<span><span style="width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:3px"></span>OK</span>'

window.shfaqAnalitiken = function() {
  const para30 = new Date(); para30.setDate(para30.getDate()-30);
  const para30Str = para30.toISOString().split('T')[0];
  const sot = new Date().toISOString().split('T')[0];

  // Shitjet per produkt (me stockId)
  const shitPerStok = {};
  shitjet.forEach(function(s) {
    if (!s.stockId) return;
    if (!shitPerStok[s.stockId]) shitPerStok[s.stockId] = { total30: 0, totalGjith: 0, count: 0, lastSale: '' };
    shitPerStok[s.stockId].totalGjith += (s.total||0);
    shitPerStok[s.stockId].count++;
    if (s.data >= para30Str) shitPerStok[s.stockId].total30 += (s.total||0);
    if (!shitPerStok[s.stockId].lastSale || s.data > shitPerStok[s.stockId].lastSale) shitPerStok[s.stockId].lastSale = s.data;
  });

  // Produktet qe nuk levizin 30+ dite
  const nukLevizin = stock.filter(function(p) {
    if (p.lloji === 'set') return false;
    const sh = shitPerStok[p.id];
    if (!sh) return true; // asnjehere nuk eshte shitur me stock
    const ditePaDalur = Math.round((new Date(sot) - new Date(sh.lastSale)) / 86400000);
    return ditePaDalur > 30;
  });

  // Rotacion mesatar per produkt
  let rotRows = '';
  stock.filter(function(p) { return p.lloji !== 'set' && shitPerStok[p.id]; })
    .sort(function(a,b) { return (shitPerStok[b.id].total30||0) - (shitPerStok[a.id].total30||0); })
    .slice(0,10)
    .forEach(function(p) {
      const sh = shitPerStok[p.id];
      const ditePaDalur = sh.lastSale ? Math.round((new Date(sot) - new Date(sh.lastSale)) / 86400000) : null;
      const fitimReal = !isNaN(p.cmimiBlerjes) && p.cmimiBlerjes !== null ? fm(sh.totalGjith - p.cmimiBlerjes * sh.count) : '-';
      rotRows += '<div class="top-row" style="padding:8px 0">'
        + '<div class="top-info"><strong>' + p.emri + '</strong>'
        + '<span>' + sh.count + ' shitje &bull; ' + (ditePaDalur !== null ? ditePaDalur + ' dite pa dale' : '') + ' &bull; Fitim real: ' + fitimReal + '</span></div>'
        + '<div class="top-total">' + fm(sh.total30) + '</div></div>';
    });

  let nukLevizinRows = nukLevizin.length
    ? nukLevizin.map(function(p) {
        const sh = shitPerStok[p.id];
        const lastSale = sh && sh.lastSale ? sh.lastSale : 'Asnjehere';
        return '<div class="top-row" style="padding:8px 0">'
          + '<div class="top-info"><strong>' + p.emri + '</strong>'
          + '<span>Shitja e fundit: ' + lastSale + ' &bull; ' + (p.sasia||0) + ' cope ne stock</span></div>'
          + '<div style="font-size:12px;color:var(--error);font-weight:600">30+ dite</div></div>';
      }).join('')
    : '<div class="empty-state">Te gjitha produktet kane levizur!</div>';

  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = '<div class="modal-box" style="max-height:85vh;overflow-y:auto">'
    + '<h3 style="margin-bottom:16px">&#128202; Analitike Stoku</h3>'
    + '<div style="font-size:13px;font-weight:600;color:var(--error);margin-bottom:8px">&#9888; Produktet pa levizje 30+ dite</div>'
    + nukLevizinRows
    + '<div style="font-size:13px;font-weight:600;color:var(--accent);margin:16px 0 8px">&#128200; Top 10 produktet (30 ditet e fundit)</div>'
    + (rotRows || '<div class="empty-state">Nuk ka te dhena (nevojitet stockId ne shitje)</div>')
    + '<button onclick="this.closest(\'.modal-overlay\').remove()" style="width:100%;margin-top:16px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;color:var(--text);cursor:pointer;font-family:DM Sans,sans-serif">Mbylle</button>'
    + '</div>';
  document.body.appendChild(ov);
};

// ── HELPER: nderto pemen e kategorive ─────────────
function buildKatTree() {
  // Level 1: pa prind
  const roots = kategorite.filter(function(k) { return !k.parentId; });
  function getChildren(parentId) {
    return kategorite.filter(function(k) { return k.parentId === parentId; });
  }
  return { roots: roots, getChildren: getChildren };
}

function buildKatSelector(selectedId, excludeId, indent) {
  indent = indent || 0;
  const tree = buildKatTree();
  let opts = '<option value="">— Pa kategori —</option>';
  function addLevel(nodes, level) {
    nodes.forEach(function(k) {
      if (k.id === excludeId) return;
      const prefix = '&nbsp;'.repeat(level * 4);
      opts += '<option value="' + k.id + '"' + (selectedId === k.id ? ' selected' : '') + '>' + prefix + k.emri + '</option>';
      addLevel(tree.getChildren(k.id), level + 1);
    });
  }
  addLevel(tree.roots, 0);
  return opts;
}

function buildKatTreeHTML(nodes, tree, level) {
  level = level || 0;
  if (!nodes.length) return '';
  let h = '';
  nodes.forEach(function(k) {
    const nrProd = stock.filter(function(p) { return p.kategoriaId === k.id; }).length;
    const children = tree.getChildren(k.id);
    const canAddChild = level < 2; // max 3 nivele (0,1,2)
    h += '<div style="margin-left:' + (level*20) + 'px;border-left:' + (level>0?'2px solid var(--border)':'none') + ';padding-left:' + (level>0?'10px':'0') + ';margin-bottom:4px">'
      + '<div style="display:flex;align-items:center;gap:8px;padding:8px 0">'
      + '<span style="font-size:12px;color:var(--text2)">' + (level===0?'▸':level===1?'▹':'◦') + '</span>'
      + '<span style="flex:1;font-weight:' + (level===0?'600':'400') + ';font-size:' + (level===0?'14':'13') + 'px">' + k.emri + '</span>'
      + '<span style="font-size:11px;color:var(--text2)">' + nrProd + ' prod</span>'
      + (canAddChild ? '<button data-kid="' + k.id + '" data-level="' + (level+1) + '" onclick="shtoNenkategorine(this.dataset.kid, parseInt(this.dataset.level))" style="background:none;border:1px solid var(--border);border-radius:6px;color:var(--text2);cursor:pointer;font-size:11px;padding:2px 7px">+Sub</button>' : '')
      + '<button data-kid="' + k.id + '" onclick="fshijKategorine(this.dataset.kid)" style="background:none;border:none;color:var(--error);cursor:pointer;font-size:16px">&times;</button>'
      + '</div>'
      + buildKatTreeHTML(children, tree, level + 1)
      + '</div>';
  });
  return h;
}

window.shfaqFotoStock = function(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX = 400;
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = Math.round(h*MAX/w); w = MAX; } }
      else { if (h > MAX) { w = Math.round(w*MAX/h); h = MAX; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      window._stockFotoB64 = canvas.toDataURL('image/jpeg', 0.75);
      const prev = document.getElementById('st-foto-preview');
      if (prev) prev.innerHTML = '<img src="' + window._stockFotoB64 + '" style="width:100%;height:100%;object-fit:cover">';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(input.files[0]);
};

window.fshiFotoStock = function() {
  window._stockFotoB64 = null;
  const prev = document.getElementById('st-foto-preview');
  if (prev) prev.innerHTML = '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px">&#128247;</div>';
};

window.shfaqFotoSet = function(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX = 400;
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = Math.round(h*MAX/w); w = MAX; } }
      else { if (h > MAX) { w = Math.round(w*MAX/h); h = MAX; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      window._setFotoB64 = canvas.toDataURL('image/jpeg', 0.75);
      const prev = document.getElementById('set-foto-preview');
      if (prev) prev.innerHTML = '<img src="' + window._setFotoB64 + '" style="width:100%;height:100%;object-fit:cover">';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(input.files[0]);
};

window.fshiFotoSet = function() {

// ── FITIMI NE RAPORTE ─────────────────────────────
function llogaritFitimin(shitjetLista) {
  // Match shitjet me stock per te llogaritur fitimin
  const stockMap = {};
  stock.forEach(function(p) {
    const key = (p.emri||'').toLowerCase().trim();
    stockMap[key] = p.cmimiBlerjes || 0;
  });

  let totalFitim = 0;
  let totalShitje = 0;
  let totalKosto = 0;
  let saBejneFitim = 0;

  shitjetLista.forEach(function(s) {
    const total = s.total || 0;
    totalShitje += total;
    const key = (s.produkti||'').toLowerCase().trim();
    const blerje = stockMap[key] || 0;
    if (blerje > 0) {
      const kosto = blerje * (s.sasia||1);
      totalKosto += kosto;
      totalFitim += total - kosto;
      saBejneFitim++;
    }
  });

  return {
    totalShitje: totalShitje,
    totalKosto: totalKosto,
    totalFitim: totalFitim,
    marzhi: totalShitje > 0 ? (totalFitim / totalShitje * 100).toFixed(1) : 0,
    coverage: shitjetLista.length > 0 ? (saBejneFitim / shitjetLista.length * 100).toFixed(0) : 0
  };
}

function renderPosta() {

  if (!isAdmin || previewMode) {
    const historiku = postat.filter(function(p) { return p.punetoriUid === currentUser.uid; });
    let hist = historiku.map(function(p) {
      const data = p.krijuar && p.krijuar.seconds ? new Date(p.krijuar.seconds*1000).toLocaleDateString('sq',{day:'numeric',month:'short'}) : (p.data||'');
      const ora = p.krijuar && p.krijuar.seconds ? new Date(p.krijuar.seconds*1000).toLocaleTimeString('sq',{hour:'2-digit',minute:'2-digit'}) : '';
      const status = p.procesuar
        ? '<span style="color:var(--success);font-size:12px">&#10003; E procesuar</span>'
        : '<span style="color:var(--accent);font-size:12px">&#9679; Ne pritje</span>';

    }).join('') || '<div class="empty-state">Nuk ka poste te raportuar.</div>';

      + '<div style="font-size:48px;margin-bottom:16px">&#128230;</div>'

      + '</div>'

  }

  // Admin view
  const neProc = postat.filter(function(p) { return !p.procesuar; });
  const proc = postat.filter(function(p) { return p.procesuar; });

  let neP = '';
  neProc.forEach(function(p) {
    const data = p.krijuar && p.krijuar.seconds ? new Date(p.krijuar.seconds*1000).toLocaleDateString('sq',{day:'numeric',month:'short',year:'numeric'}) : (p.data||'');
    const ora = p.krijuar && p.krijuar.seconds ? new Date(p.krijuar.seconds*1000).toLocaleTimeString('sq',{hour:'2-digit',minute:'2-digit'}) : '';
    const produktet = p.produktet || [];

          + '<span style="flex:1">' + pr.emri + (sasia > 1 ? ' <span style="color:var(--text2)">x' + sasia + '</span>' : '') + '</span>'
          + '<span style="color:var(--accent);font-weight:600">' + fm(totalPr) + '</span>'
          + '<button data-pid="' + p.id + '" data-idx="' + i + '" onclick="fshiProduktPoste(this.dataset.pid, parseInt(this.dataset.idx))" style="background:none;border:none;color:var(--error);cursor:pointer;font-size:18px;line-height:1">&times;</button>'
          + '</div>';
      });
      const total = produktet.reduce(function(a,pr) { return a+(pr.cmimi||0)*(pr.sasia||1); }, 0);
      prodH += '<div style="border-top:1px solid var(--border);padding-top:8px;display:flex;justify-content:space-between;font-weight:600;font-size:13px">'
        + '<span>Total:</span><span style="color:var(--accent)">' + fm(total) + '</span></div>';
    } else {
      prodH = '<div style="font-size:13px;color:var(--text2);padding:6px 0">Shto produktet dhe cmimet:</div>';
    }
    neP += '<div class="form-card" style="border-color:rgba(240,180,41,0.5)">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">'
      + '<div><strong>&#128230; Poste e re</strong><div style="font-size:12px;color:var(--text2);margin-top:3px">' + (p.punetori||'') + ' &bull; ' + data + ' ora ' + ora + '</div></div>'
      + '<span style="background:rgba(240,180,41,0.15);color:var(--accent);font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600">NE PRITJE</span></div>'

      + '</div></div>';

  let prH = proc.slice(0,10).map(function(p) {
    const data = p.krijuar && p.krijuar.seconds ? new Date(p.krijuar.seconds*1000).toLocaleDateString('sq') : (p.data||'');

  document.body.appendChild(ov);
  setTimeout(function() {
    const sel = document.getElementById('pp-stock-sel');
    if (!sel) document.getElementById('pp-emri').focus();
  }, 100);
};

window.zgjidhProdPostStock = function() {
  const sel = document.getElementById('pp-stock-sel');
  if (!sel || !sel.value) return;
  const opt = sel.options[sel.selectedIndex];
  const emriEl = document.getElementById('pp-emri');
  const cmimiEl = document.getElementById('pp-cmimi');
  if (emriEl) emriEl.value = opt.value;
  if (cmimiEl) cmimiEl.value = opt.getAttribute('data-cmimi') || '';
};

window.konfirmoShtoProdukt = async function(postaId) {
  const emri = document.getElementById('pp-emri')?.value?.trim();
  const cmimi = parseFloat(document.getElementById('pp-cmimi')?.value);
  const sasia = parseInt(document.getElementById('pp-sasia')?.value) || 1;
  if (!emri) return err('Shkruaj emrin!');
  if (isNaN(cmimi) || cmimi < 0) return err('Shkruaj cmimin!');
  document.getElementById('modal-pp')?.remove();
  try {
    const posta = postat.find(function(p) { return p.id === postaId; });
    const produktet = (posta?.produktet||[]).concat([{emri: emri, cmimi: cmimi, sasia: sasia}]);
    await updateDoc(doc(db, 'postat', postaId), {produktet: produktet});
  } catch(e) { err(e.message); }
};

window.fshiProduktPoste = async function(postaId, idx) {
  try {
    const posta = postat.find(function(p) { return p.id === postaId; });
    const produktet = (posta?.produktet||[]).filter(function(_,i) { return i !== idx; });
    await updateDoc(doc(db, 'postat', postaId), {produktet: produktet});
  } catch(e) { err(e.message); }
};

window.procesoPosta = async function(postaId) {
  const posta = postat.find(function(p) { return p.id === postaId; });
  if (!posta || !posta.produktet || !posta.produktet.length) return err('Shto te pakten nje produkt!');
  const sotStr = new Date().toISOString().split('T')[0];
  const dataShitjes = posta.data || sotStr;
  const ora = new Date().toLocaleTimeString('sq', {hour:'2-digit', minute:'2-digit'});
  try {
    await Promise.all(posta.produktet.map(function(pr) {
      return addDoc(collection(db, 'shitjet'), {
        produkti: pr.emri,
        sasia: pr.sasia || 1,
        cmimi: pr.cmimi,
        njesia: 'cop',
        total: pr.cmimi * (pr.sasia||1),
        data: dataShitjes,
        punetori: 'posta',
        punetoriUid: 'admin_posta',
        klienti: '',
        shen: 'Shitje online - posta ' + dataShitjes,
        krijuar: serverTimestamp(),
        ndryshuar: serverTimestamp(),
        ngaPosta: true,
      });
    }));
    const total = posta.produktet.reduce(function(a,pr) { return a+(pr.cmimi||0)*(pr.sasia||1); }, 0);
    await updateDoc(doc(db, 'postat', postaId), {
      procesuar: true, procesuarNe: serverTimestamp(), totalPosta: total
    });

    // Njoftim Telegram
    let prodLines = posta.produktet.map(function(pr) {
      return '  ' + pr.emri + ' x' + (pr.sasia||1) + ' = ' + fm((pr.cmimi||0)*(pr.sasia||1));
    }).join('\n');
    await tg('POSTA U PROCESUA - DOHA Accessories\n\nData: ' + dataShitjes + '\nOra: ' + ora + '\nPunetori: ' + (posta.punetori||'-') + '\n\nProduktet:\n' + prodLines + '\n\nTotal: ' + fm(total));

    ok('Posta u procesua! ' + posta.produktet.length + ' produkte => shitje (' + fm(total) + ')');
  } catch(e) { err(e.message); }
};

// ── SHPENZIME ─────────────────────────────────────

  const sotStr = new Date().toISOString().split('T')[0];
  const totalSot = shpenzimetSot.reduce(function(a,s) { return a+(s.shuma||0); }, 0);

  let rows = '';
  shpenzimetSot.forEach(function(s) {
    const ora = s.krijuar && s.krijuar.seconds
      ? new Date(s.krijuar.seconds*1000).toLocaleTimeString('sq',{hour:'2-digit',minute:'2-digit'}) : '';
    if (s.id && s.fotoUrl) fotoMap[s.id] = s.fotoUrl;
    rows += '<div class="top-row">'
      + '<div class="top-info"><strong>' + (s.pershkrimi||'Shpenzim') + '</strong>'
      + '<span>' + ora
      + (isAdminView() ? ' &bull; <span class="punetor-tag">' + (s.punetori||'-') + '</span>' : '')
      + (s.fotoUrl ? ' &bull; <button data-sid="' + s.id + '" onclick="shfaqFotoById(this.dataset.sid)" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;padding:0;font-family:DM Sans,sans-serif">&#128247; foto</button>' : '')
      + '</span></div>'
      + '<div style="text-align:right"><div style="font-weight:700;color:var(--error)">-' + fm(s.shuma||0) + '</div>'
      + '<button data-sid="' + s.id + '" onclick="fshiShpenzimin(this.dataset.sid)" style="background:none;border:none;color:var(--error);cursor:pointer;font-size:12px;opacity:0.7">fshij</button>'
      + '</div></div>';
  });

  document.getElementById('content').innerHTML =
    '<div class="page-header"><h1 class="page-title">Shpenzime</h1></div>'
    + '<div class="stats-grid">'
    + '<div class="stat-card accent">' + icoStat('karte') + '<div class="stat-info"><span class="stat-val" data-count="' + numVal(totalSot) + '" data-prefix="EUR " data-dec="1">' + fm(totalSot) + '</span><span class="stat-label">Sot</span></div></div>'
    + '<div class="stat-card">' + icoStat('fature') + '<div class="stat-info"><span class="stat-val" data-count="' + numVal(shpenzimetSot.length) + '">' + shpenzimetSot.length + '</span><span class="stat-label">Shpenzime</span></div></div>'
    + '</div>'
    + '<div class="form-card">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
    + '<div class="section-title">Sot - ' + sotStr + '</div>'
    + (!isAdminView() ? '<button class="btn-primary small" onclick="shtoShpenzim()">+ Shto</button>' : '')
    + '</div>'
    + (rows || '<div class="empty-state">Nuk ka shpenzime sot.</div>')

  ov.id = 'modal-shpenzim';
  ov.innerHTML = '<div class="modal-box">'
    + '<h3 style="margin-bottom:16px">Shto Shpenzim</h3>'

    + '<div class="form-group" style="margin-bottom:12px"><label>Shuma (EUR)</label>'

    + '<div class="form-group" style="margin-bottom:16px"><label>Foto (opsionale)</label>'

    + '</div>'
    + '<input type="file" id="sh-foto-input" accept="image/*" capture="environment" style="display:none" onchange="shfaqFotoShpenzim(this)">'

    + '</div></div>';

window.shfaqFotoShpenzim = function(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX = 800;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const b64 = canvas.toDataURL('image/jpeg', 0.7);
      window._shFotoB64 = b64;
      document.getElementById('sh-foto-preview').innerHTML =
        '<img src="' + b64 + '" style="width:100%;max-height:120px;object-fit:cover;border-radius:8px;margin-top:4px">';
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(input.files[0]);
};

window.ruajShpenzimin = async function() {
  const pershk = document.getElementById('sh-pershk')?.value?.trim();
  const shuma = parseFloat(document.getElementById('sh-shuma')?.value);
  if (!pershk) return err('Shkruaj pershkrimin!');
  if (isNaN(shuma) || shuma <= 0) return err('Shkruaj shunen!');
  const sotStr = new Date().toISOString().split('T')[0];
  const punetor = (currentUser.email||'').split('@')[0];
  const ora = new Date().toLocaleTimeString('sq',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('modal-shpenzim')?.remove();
  try {
    const data = {
      pershkrimi: pershk,
      shuma: shuma,
      data: sotStr,
      punetori: punetor,
      punetoriUid: currentUser.uid,
      krijuar: serverTimestamp(),
    };
    if (window._shFotoB64) { data.fotoUrl = window._shFotoB64; window._shFotoB64 = null; }
    const docRef = await addDoc(collection(db, 'shpenzime'), data);
    shpenzimetSot.push(Object.assign({id: docRef.id}, data));
    await tg('SHPENZIM - DOHA Accessories\n\nPunetori: ' + punetor + '\nData: ' + sotStr + '\nOra: ' + ora + '\nPershkrimi: ' + pershk + '\nShuma: -' + fm(shuma));
    ok('Shpenzimi u shtua!');
    shpenzimetSotAll = null;
    if (currentView === 'shpenzime') renderShpenzime();
  } catch(e) { err(e.message); }
};

window.fshiShpenzimin = async function(id) {
  if (!confirm('Fshij këtë shpenzim?')) return;
  try {
    await deleteDoc(doc(db, 'shpenzime', id));
    shpenzimetSot = shpenzimetSot.filter(function(s) { return s.id !== id; });
    ok('Shpenzimi u fshi!');
    if (currentView === 'shpenzime') renderShpenzime();
    if (currentView === 'raporte') ngarkoShpenzimeRap();
  } catch(e) { err(e.message); }
};

async function ngarkoShpenzimetSot() {
  try {
    const sotStr = new Date().toISOString().split('T')[0];
    const snap = await getDocs(query(
      collection(db, 'shpenzime'),
      where('data','==',sotStr),
      orderBy('krijuar', 'desc')
    ));
    const te_gjitha = snap.docs.map(function(d) { return Object.assign({id: d.id}, d.data()); });
    shpenzimetSot = isAdmin
      ? te_gjitha.filter(function(s) { return s.data === sotStr; })
      : te_gjitha.filter(function(s) { return s.data === sotStr && s.punetoriUid === currentUser.uid; });
  } catch(e) { console.warn('shpenzime:', e.message); }
}

// ── REKORD DITOR ──────────────────────────────────
async function kontrolloRekordin(punetor, data, shitjaERe) {
  try {
    // Total i dites aktuale (duke perfshire shitjen e re)
    const shitjetSotPunetor = shitjet.filter(function(s) {
      return s.data === data && s.punetori === punetor;
    });
    const totalSot = shitjetSotPunetor.reduce(function(a,s) { return a+(s.total||0); }, 0) + shitjaERe;

    // Gjej totalin me te larte historik per kete punetor
    const totalPerDite = {};
    shitjet.forEach(function(s) {
      if (s.punetori !== punetor || !s.data || s.data === data) return;
      if (!totalPerDite[s.data]) totalPerDite[s.data] = 0;
      totalPerDite[s.data] += (s.total||0);
    });
    const rekordiMeParë = Object.values(totalPerDite).length
      ? Math.max.apply(null, Object.values(totalPerDite)) : 0;

    // Nëse thyhet rekordi
    if (rekordiMeParë > 0 && totalSot > rekordiMeParë) {
      await tg('REKORD PERSONAL - DOHA Accessories\n\n' + punetor + ' po thyen rekordin ditor!\n\nRekord i ri: ' + fm(totalSot) + '\nRekord i vjeter: ' + fm(rekordiMeParë) + '\nData: ' + data + '\n\nVazhdoni keshtu!');
    }
  } catch(e) { console.warn('rekord check:', e.message); }
}

// ── OFFLINE MODE ──────────────────────────────────
const OFFLINE_STORE = 'doha_offline_queue';

function offlineQueue() {
  try { return JSON.parse(localStorage.getItem(OFFLINE_STORE) || '[]'); } catch(e) { return []; }
}
function offlineSave(queue) {
  localStorage.setItem(OFFLINE_STORE, JSON.stringify(queue));
}

async function shtoPorositOffline(data) {
  const queue = offlineQueue();
  queue.push(Object.assign({}, data, { _offlineId: Date.now() + '_' + Math.random(), _koha: new Date().toISOString() }));
  offlineSave(queue);
  updateOfflineBanner();
}

async function sinkronizoOffline() {
  const queue = offlineQueue();
  if (!queue.length) return;
  let sukses = 0;
  const mbetur = [];
  for (const item of queue) {
    try {
      const { _offlineId, _koha, type, ...data } = item;
      if (type === 'shitje') {
        await addDoc(collection(db, 'shitjet'), Object.assign({}, data, { krijuar: serverTimestamp(), ndryshuar: serverTimestamp() }));
      } else if (type === 'shpenzim') {
        await addDoc(collection(db, 'shpenzime'), Object.assign({}, data, { krijuar: serverTimestamp() }));
      } else if (type === 'arka') {
        await setDoc(doc(db, 'arka', data.uid + '_' + data.data), Object.assign({}, data, { krijuar: serverTimestamp() }));
      }
      sukses++;
    } catch(e) {
      mbetur.push(item);
    }
  }
  offlineSave(mbetur);
  if (sukses > 0) {
    ok(sukses + ' shitje offline u sinkronizuan!');
    updateOfflineBanner();
  }
}

function updateOfflineBanner() {
  const queue = offlineQueue();
  let banner = document.getElementById('offline-banner');
  if (!banner) {
    banner = document.createElement('div');
    banner.id = 'offline-banner';
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:var(--error);color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:600;z-index:9999;display:none';
    document.body.appendChild(banner);
  }
  if (!navigator.onLine) {
    banner.style.display = 'block';
    banner.textContent = '● Offline' + (queue.length > 0 ? ' — ' + queue.length + ' shitje ne pritje' : '');
  } else if (queue.length > 0) {
    banner.style.display = 'block';
    banner.style.background = 'var(--accent)';
    banner.style.color = '#111';
    banner.textContent = '↑ Duke sinkronizuar ' + queue.length + ' shitje...';
    sinkronizoOffline().then(function() {
      if (!offlineQueue().length) banner.style.display = 'none';
    });
  } else {
    banner.style.display = 'none';
  }
}

// Listen for online/offline
window.addEventListener('online', function() { updateOfflineBanner(); sinkronizoOffline(); });
window.addEventListener('offline', function() { updateOfflineBanner(); });

// Service Worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/shitjet-app/sw.js').then(function(reg) {
    console.log('SW registered');
    // Listen for sync messages from SW
    navigator.serviceWorker.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'DO_SYNC') sinkronizoOffline();
    });
  }).catch(function(e) { console.warn('SW reg failed:', e.message); });
}

// ── PUSH NOTIFICATIONS ─────────────────────────────
async function kerkoPushPermission() {
  if (!('Notification' in window) || !('serviceWorker' in navigator)) return;
  if (Notification.permission === 'granted') return;
  if (Notification.permission === 'denied') return;
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    ok('Njoftimet u aktivizuan!');
  }
}

function dergoPushLokal(title, body) {
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  try {
    navigator.serviceWorker.ready.then(function(reg) {
      reg.showNotification(title, {
        body: body,
        icon: '/shitjet-app/icon-192.png',
        vibrate: [200, 100, 200],
        badge: '/shitjet-app/icon-192.png'
      });
    });
  } catch(e) { console.warn('push lokal:', e.message); }
}
